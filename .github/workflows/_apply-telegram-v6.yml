name: Apply Telegram Dashboard v6
on:
  push:
    branches: [feat/pro-telegram-dashboard-v6e]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Telegram dashboard
        env:
          TARGET_BRANCH: feat/pro-telegram-dashboard-v6e
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path('scripts/telegram-lib.js')
          s = lib.read_text()
          new_subject = r'''function subjectEmoji(text) {
            if (!text) return '';
            const t = String(text).toLowerCase();
            if (/polity|constitution|article|fundamental|dp|amendment|parliament|supreme court|high court|judiciary|laxmikanth|preamble/i.test(t)) return '⚖️';
            if (/geography|climate|map|river|mountain|ocean|soil|monsoon|latitud|longitude|earthquake|volcano/i.test(t)) return '🌍';
            if (/math|calcul|number|algebra|geometry|trigon|profit|loss|percent|speed|time.*work|interest|simplif|averag|ratio|proportion|lcm|hcf|mensur/i.test(t)) return '🧮';
            if (/reason|syllog|coding|decod|seri|analog|blood relat|direc|dice|calendar|rank|puzzle|mirror|water/i.test(t)) return '🧠';
            if (/english|gram|vocab|comprehen|cloze|error|spot|fill|phras|idiom|synonym|antonym|passage|sentence/i.test(t)) return '📖';
            if (/econom|budget|gdp|inflat|tax|market|bank|rbi|sebi|supply|demand|niti|five year/i.test(t)) return '💰';
            if (/histor|mughal|british|ancient|medieval|modern|freedom|independ|guerilla|dynasty|empire|sultanate|vijay/i.test(t)) return '🏛️';
            if (/science|physics|chemistry|biolog|botan|zoolog|cell|atom|gravit|element|reaction|geneti|evolut|digest/i.test(t)) return '🔬';
            if (/current affair|news|event|award|appointment|sport|summit|index|report|committee|mission|scheme|yojana/i.test(t)) return '📰';
            if (/gk|general know|static|national|capital|currenc|symbol|festival|dance/i.test(t)) return '❓';
            if (/essay|writ|letter|précis|comprehension|draft/i.test(t)) return '✍️';
            if (/mock|test|practice|solve|attempt|question|quiz|mcq|previous year|pyq/i.test(t)) return '📝';
            if (/revision|revise|review|re-read|doobara/i.test(t)) return '🔄';
            if (/video|lecture|watch|see|youtube|class/i.test(t)) return '🎬';
            if (/di|data interpret|chart|graph|table/i.test(t)) return '📊';
            return '➜';
          }
          '''
          s2 = re.sub(r"function subjectEmoji\(text\) \{.*?\n\}\n\n/\*\* Build a styled section header", new_subject + "/** Build a styled section header", s, count=1, flags=re.S)
          if s2 == s:
              raise SystemExit('subjectEmoji block not found')
          lib.write_text(s2)

          dash = Path('scripts/telegram-dashboard.js')
          d = dash.read_text()

          keyboard_block = r'''/* ================================================================
             INLINE KEYBOARDS
             ================================================================ */

          /** v6 is intentionally read-only: no inline action/navigation buttons. */
          function morningKeyboard() { return null; }
          function eveningKeyboard() { return null; }

          /* ================================================================
             DATA HELPERS
             ================================================================ */'''
          d2 = re.sub(r"/\* ================================================================\n   INLINE KEYBOARDS\n   ================================================================ \*/.*?/\* ================================================================\n   DATA HELPERS\n   ================================================================ \*/", keyboard_block, d, count=1, flags=re.S)
          if d2 == d:
              raise SystemExit('keyboard block not found')

          morning = r'''function buildMorningDashboard(name, appState, topicDigest, dateStr) {
            const { todoLines, videoItems, doneCount } = buildTaskSections(appState, dateStr);
            const total = todayTotalTasks(appState, dateStr);
            const pending = todoLines.filter(t => !t.overdue);
            const overdue = todoLines.filter(t => t.overdue);
            const streak = calculateStreak(appState);
            const focus = deriveFocus(todoLines, topicDigest);
            const weakArea = findWeakArea(todoLines);
            const priorities = getTopPriorities(todoLines);
            const dateLabel = fmtShort(dateStr).toUpperCase();
            const pct = total ? Math.round((doneCount / total) * 100) : 0;
            const L = [];

            L.push(`<b>☀️ GOOD MORNING${name && name !== 'there' ? `, ${escHtml(name.toUpperCase())}` : ''}</b>`);
            L.push(`<i>${dateLabel}</i>`);
            L.push('━━━━━━━━━━━━━━━━━━━━');

            L.push('<b>🎯 TODAY’S FOCUS</b>');
            L.push(`${subjectEmoji(focus)} ${escHtml(focus.length > 70 ? focus.slice(0, 70) + '…' : focus)}`);
            L.push('');

            L.push('<b>📊 PROGRESS</b>');
            L.push(total ? `${progressBar(doneCount, total, 12)}\n<b>${doneCount}</b> completed  •  <b>${total - doneCount}</b> pending` : 'No tasks tracked today');
            L.push(`🔥 <b>${streak} day study streak</b>`);
            L.push('');

            if (priorities.length) {
              L.push('<b>🔥 TOP PRIORITIES</b>');
              priorities.forEach((t, i) => {
                const raw = t.rawText || 'Task';
                L.push(`${['①','②','③'][i] || `${i + 1}.`} ${subjectEmoji(raw)} ${escHtml(raw.length > 60 ? raw.slice(0, 60) + '…' : raw)}`);
              });
              L.push('');
            }

            if ((topicDigest && topicDigest.trim()) || pending.length || overdue.length) {
              L.push('<b>📚 STUDY PLAN</b>');
              if (topicDigest && topicDigest.trim()) {
                topicDigest.trim().split('\n').filter(Boolean).slice(0, 4).forEach(line => {
                  L.push(`${subjectEmoji(line)} ${escHtml(line)}`);
                });
              }
              pending.slice(0, 6).forEach(t => {
                const raw = t.rawText || 'Task';
                L.push(`○ ${subjectEmoji(raw)} ${escHtml(raw.length > 70 ? raw.slice(0, 70) + '…' : raw)}`);
              });
              if (pending.length + (topicDigest ? topicDigest.trim().split('\n').filter(Boolean).length : 0) > 6) L.push('<i>…more tasks in ExamZen</i>');
              if (overdue.length) {
                L.push('');
                L.push(`<b>⚠️ ROLLED OVER</b>  ${overdue.length} task${overdue.length === 1 ? '' : 's'}`);
              }
              L.push('');
            }

            if (videoItems.length) {
              L.push('<b>🎬 VIDEOS</b>');
              videoItems.slice(0, 4).forEach(v => {
                L.push(`▶️ <a href="${v.url}">${escHtml(v.title.length > 65 ? v.title.slice(0, 65) + '…' : v.title)}</a>`);
              });
              if (videoItems.length > 4) L.push(`<i>…+${videoItems.length - 4} more</i>`);
              L.push('');
            }

            if (weakArea) {
              L.push('<b>⚠️ NEEDS ATTENTION</b>');
              L.push(`${weakArea.emoji} ${escHtml(weakArea.name)}  •  ${weakArea.count} pending`);
              L.push('');
            }

            L.push('━━━━━━━━━━━━━━━━━━━━');
            L.push(`🔥 <b>STUDY STREAK: ${streak} DAYS</b>`);
            return { text: L.join('\n'), hasContent: true };
          }

          /* ================================================================
             EVENING DASHBOARD BUILDER
             ================================================================ */'''
          d3 = re.sub(r"function buildMorningDashboard\(name, appState, topicDigest, dateStr\) \{.*?/\* ================================================================\n   EVENING DASHBOARD BUILDER\n   ================================================================ \*/", morning, d2, count=1, flags=re.S)
          if d3 == d2:
              raise SystemExit('morning builder not found')

          evening = r'''function buildEveningDashboard(name, appState, dateStr) {
            const { todoLines, videoItems, doneCount } = buildTaskSections(appState, dateStr);
            const tasks = (appState && appState.tasks && Array.isArray(appState.tasks[dateStr])) ? appState.tasks[dateStr] : [];
            const total = todayTotalTasks(appState, dateStr);
            const pending = todoLines.filter(t => !t.overdue);
            const overdue = todoLines.filter(t => t.overdue);
            const completed = tasks.filter(t => t && (t.done === true || t.status === 'done'));
            const streak = calculateStreak(appState);
            const weakArea = findWeakArea(todoLines);
            const pct = total ? Math.round((doneCount / total) * 100) : 0;
            const dateLabel = fmtShort(dateStr).toUpperCase();
            const L = [];

            if (!total && !pending.length && !overdue.length && !videoItems.length) return { text: '', hasContent: false };

            L.push(`<b>🌙 DAILY REVIEW${name && name !== 'there' ? `, ${escHtml(name.toUpperCase())}` : ''}</b>`);
            L.push(`<i>${dateLabel}</i>`);
            L.push('━━━━━━━━━━━━━━━━━━━━');

            L.push('<b>🏆 TODAY’S RESULT</b>');
            L.push(total ? `${progressBar(doneCount, total, 12)}\n<b>${doneCount}/${total}</b> tasks completed  •  <b>${pct}%</b>` : 'No tracked tasks today');
            L.push(`🔥 <b>${streak} day study streak</b>`);
            L.push('');

            if (completed.length) {
              L.push(`<b>✅ COMPLETED</b>  <i>${completed.length}</i>`);
              completed.slice(0, 6).forEach(t => {
                const raw = t.text || 'Task';
                L.push(`✓ ${subjectEmoji(raw)} ${escHtml(raw.length > 65 ? raw.slice(0, 65) + '…' : raw)}`);
              });
              if (completed.length > 6) L.push(`<i>…+${completed.length - 6} more</i>`);
              L.push('');
            }

            if (pending.length) {
              L.push(`<b>⏳ STILL PENDING</b>  <i>${pending.length}</i>`);
              pending.slice(0, 6).forEach(t => {
                const raw = t.rawText || 'Task';
                L.push(`○ ${subjectEmoji(raw)} ${escHtml(raw.length > 65 ? raw.slice(0, 65) + '…' : raw)}`);
              });
              if (pending.length > 6) L.push(`<i>…+${pending.length - 6} more</i>`);
              L.push('');
            }

            if (overdue.length) {
              L.push(`<b>⚠️ ROLLED OVER</b>  <i>${overdue.length}</i>`);
              overdue.slice(0, 4).forEach(t => {
                const raw = t.rawText || 'Task';
                L.push(`↻ ${subjectEmoji(raw)} ${escHtml(raw.length > 65 ? raw.slice(0, 65) + '…' : raw)}`);
              });
              L.push('');
            }

            if (videoItems.length) {
              L.push('<b>🎬 VIDEOS</b>');
              videoItems.slice(0, 3).forEach(v => L.push(`▶️ <a href="${v.url}">${escHtml(v.title.length > 65 ? v.title.slice(0, 65) + '…' : v.title)}</a>`));
              L.push('');
            }

            if (weakArea) {
              L.push('<b>⚠️ NEEDS ATTENTION</b>');
              L.push(`${weakArea.emoji} ${escHtml(weakArea.name)}  •  ${weakArea.count} pending`);
              L.push('');
            }

            const insight = pct >= 100 ? 'Excellent finish. Keep the streak going.' : pct >= 70 ? 'Good progress. Clear the remaining items tomorrow.' : pct >= 40 ? 'Decent progress. Protect your first study block tomorrow.' : 'Low completion today. Start tomorrow with the highest-priority task.';
            L.push('<b>🧠 TODAY’S INSIGHT</b>');
            L.push(escHtml(insight));
            L.push('━━━━━━━━━━━━━━━━━━━━');
            return { text: L.join('\n'), hasContent: true };
          }

          /* ================================================================
             PRIORITY HELPER
             ================================================================ */'''
          d4 = re.sub(r"function buildEveningDashboard\(name, appState, dateStr\) \{.*?/\* ================================================================\n   PRIORITY HELPER\n   ================================================================ \*/", evening, d3, count=1, flags=re.S)
          if d4 == d3:
              raise SystemExit('evening builder not found')
          dash.write_text(d4)
          PY

          node --check scripts/telegram-lib.js
          node --check scripts/telegram-dashboard.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/telegram-lib.js scripts/telegram-dashboard.js
          git commit -m "feat: redesign Telegram study dashboards" || true
          git push origin "$TARGET_BRANCH"
          git rm .github/workflows/_apply-telegram-v6.yml
          git commit -m "chore: remove temporary dashboard patch workflow"
          git push origin "$TARGET_BRANCH"
