name: OpenCode Keep-Alive

# Render's Free tier suspends a web service after ~15 minutes of no inbound
# traffic. The separately deployed OpenCode server (see OPENCODE_SERVER_URL in
# youtube-turbo-proxy/render.yaml) is only called when a student actually runs
# Study AI / AI Tutor, so it routinely sleeps — and the first real request then
# answers HTTP 502 (service waking up), surfacing to students as
# "OpenCode failed while starting the Study AI session (HTTP 502)".
#
# This workflow pings the OpenCode service every ~10 minutes so Render never
# lets it fully suspend. A sleeping free-tier server answers the first ping with
# a transient 502/503/504, so we retry a couple times and only fail the run if
# the URL is persistently unreachable (which is exactly when an operator should
# look at the OpenCode logs).
#
# Setup (one time): add a repository secret named OPENCODE_KEEPALIVE_URL holding
# the OpenCode service base URL (e.g. https://your-opencode.onrender.com). The
# workflow probes that URL directly and, if reachable, a common health path.

on:
  schedule:
    # Render idle timeout is 15 min; ~10 min cadence keeps the service warm.
    # The */13 offset avoids a thundering herd on the hour.
    - cron: '*/13 * * * *'
  workflow_dispatch:

permissions:
  contents: none

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secret
        run: |
          if [ -z "$OPENCODE_KEEPALIVE_URL" ]; then
            echo "❌ OPENCODE_KEEPALIVE_URL secret is not set — skipping pings."
            exit 0   # non-fatal: just not configured
          fi
          echo "✅ OPENCODE_KEEPALIVE_URL present"
        env:
          OPENCODE_KEEPALIVE_URL: ${{ secrets.OPENCODE_KEEPALIVE_URL }}

      - name: Ping OpenCode base URL
        id: base
        continue-on-error: true
        env:
          OPENCODE_KEEPALIVE_URL: ${{ secrets.OPENCODE_KEEPALIVE_URL }}
        run: |
          # Wake the service: any 2xx/3xx is "alive". 502/503/504 during the
          # first hit usually mean "waking", so curl retries after a short delay.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
                   --retry 3 --retry-delay 8 --retry-all-errors \
                   --max-time 60 \
                   "$OPENCODE_KEEPALIVE_URL/" || echo 000)
          echo "base status=$code"
          echo "base_status=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            2*|3*) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Ping health endpoint (best effort)
        if: steps.base.outcome == 'success'
        continue-on-error: true
        env:
          OPENCODE_KEEPALIVE_URL: ${{ secrets.OPENCODE_KEEPALIVE_URL }}
        run: |
          for p in /health /api/health /status; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
                     --max-time 45 "$OPENCODE_KEEPALIVE_URL$p" || echo 000)
            echo "GET $p -> $code"
            [ "${code#2}" != "$code" ] && exit 0
          done
          exit 0   # health path may not exist; base ping already kept it warm

      - name: Report
        if: always()
        run: |
          echo "Base ping: ${{ steps.base.outputs.base_status }}"

      - name: Fail only if base ping persistently failed
        if: steps.base.outcome == 'failure' && env.OPENCODE_KEEPALIVE_URL != ''
        env:
          OPENCODE_KEEPALIVE_URL: ${{ secrets.OPENCODE_KEEPALIVE_URL }}
        run: |
          echo "::warning::OpenCode base URL did not respond (see 'Ping OpenCode base URL' step)."
          exit 1
