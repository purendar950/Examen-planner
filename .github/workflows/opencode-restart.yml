name: OpenCode Scheduled Restart

# The OpenCode server runs on Render's free tier (512MB RAM). Even a lean server
# with LSP disabled leaks memory slowly (a known upstream issue), so given enough
# uptime it drifts toward the 512MB ceiling and Render OOM-kills it, producing a
# "fail -> recover" crash loop in the service Events tab.
#
# On the free tier we can't add RAM, but we CAN restart the process before the
# leak accumulates. A fresh boot resets memory to its ~150-250MB baseline. This
# workflow triggers a Render Deploy Hook a few times a day to recycle it.
#
# Setup (one time):
#   1. In the Render dashboard: OpenCode service -> Settings -> Deploy Hook ->
#      copy the URL (looks like https://api.render.com/deploy/srv-XXXX?key=YYYY).
#   2. In this repo: Settings -> Secrets and variables -> Actions -> New secret
#      named RENDER_DEPLOY_HOOK_OPENCODE holding that URL.
#
# If the secret is absent the run is a no-op (safe to merge before configuring).

on:
  schedule:
    # Every 6 hours, offset off the hour to avoid a thundering herd. Tighten to
    # e.g. '0 */3 * * *' if memory still climbs into the ceiling between runs.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: none

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy hook (recycles the process)
        env:
          RENDER_DEPLOY_HOOK_OPENCODE: ${{ secrets.RENDER_DEPLOY_HOOK_OPENCODE }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_OPENCODE" ]; then
            echo "RENDER_DEPLOY_HOOK_OPENCODE secret is not set - skipping restart."
            exit 0   # non-fatal: just not configured yet
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
                   --retry 3 --retry-delay 8 --retry-all-errors \
                   --max-time 45 \
                   -X POST "$RENDER_DEPLOY_HOOK_OPENCODE" || echo 000)
          echo "Deploy hook responded HTTP $code"
          case "$code" in
            2*) echo "Restart triggered."; exit 0 ;;
            *) echo "::warning::Render deploy hook did not accept the restart (HTTP $code)."; exit 1 ;;
          esac
