# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch, but ONLY when files that are
  # actually part of the deployed static site change. Pushes that touch only
  # backend/server code (the Render bot, cron scripts, shared server gating,
  # Android app, docs, Firestore rules) do not affect the website, so they no
  # longer trigger a Pages deploy — which avoids pointless runs that could only
  # fail on GitHub's transient "Deployment failed, try again later" hiccup.
  # NOTE: a push that changes BOTH web and ignored files still deploys.
  push:
    branches: ["main"]
    paths-ignore:
      - 'bot/**'
      - 'scripts/**'
      - 'shared/**'
      - 'android/**'
      - 'docs/**'
      - '**.md'
      - 'firestore.rules'
      - '.github/workflows/daily-telegram.yml'
      - '.github/workflows/android.yml'

  # Allows you to run this workflow manually from the Actions tab (use this to
  # re-deploy after a transient failure instead of "Re-run failed jobs", which
  # can duplicate the github-pages artifact and cause a different failure).
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build with Vite
        run: npm run build
      
      - name: Verify dist directory
        run: |
          echo "===== Contents of dist directory ====="
          ls -la dist/
          echo ""
          echo "===== Contents of dist/css directory ====="
          ls -la dist/css/ || echo "ERROR: CSS directory not found!"
          echo ""
          echo "===== Checking if index.html exists ====="
          [ -f dist/index.html ] && echo "✓ index.html found" || echo "✗ index.html NOT found"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
