name: Apply dashboard sidebar layout fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[layout-fix-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append responsive dashboard overrides
        shell: bash
        run: |
          cat >> css/app.css <<'EOF'

/* ══════════════════════════════════════════════════════════════
   SIDEBAR-AWARE DASHBOARD GRID FIX
   The desktop shell removes the sidebar from normal flow, so viewport
   breakpoints alone are not enough: the dashboard must size itself from the
   width that remains after the rail is expanded/collapsed.
══════════════════════════════════════════════════════════════ */
@media (min-width: 901px) {
  #app .main-content:has(#page-dashboard.active) {
    container-type: inline-size;
    container-name: dashboard-workspace;
    min-width: 0;
  }

  /* Keep the three-card hero usable when the sidebar is expanded. */
  .fintech-dashboard .fin-hero-grid {
    grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.18fr) minmax(220px, .82fr);
    min-width: 0;
  }

  .fintech-dashboard .fin-readiness-card,
  .fintech-dashboard .fin-focus-card,
  .fintech-dashboard .fin-quick-card {
    min-width: 0;
    overflow: hidden;
  }

  /* The readiness card is the one that was visibly squeezing its inner stats. */
  .fintech-dashboard .fin-readiness-main {
    grid-template-columns: minmax(112px, 124px) minmax(0, 1fr);
    gap: 1rem;
    margin-top: 1.15rem;
  }
  .fintech-dashboard .fin-score-ring,
  .fintech-dashboard .fin-score-ring svg {
    width: 112px;
    height: 112px;
  }
  .fintech-dashboard .fin-readiness-copy {
    min-width: 0;
  }
  .fintech-dashboard .fin-readiness-copy h2 {
    font-size: clamp(1.2rem, 2vw, 1.65rem);
    overflow-wrap: anywhere;
  }
  .fintech-dashboard .fin-readiness-copy > p {
    max-width: none;
  }
  .fintech-dashboard .fin-readiness-metrics {
    gap: .35rem;
  }
  .fintech-dashboard .fin-readiness-metrics > div {
    min-width: 0;
    padding: .58rem .55rem;
  }
  .fintech-dashboard .fin-readiness-metrics span,
  .fintech-dashboard .fin-readiness-metrics strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Mission rows must shrink with the card instead of pushing the tag outside. */
  .fintech-dashboard .fin-focus-card .dash-todo-item {
    min-width: 0;
  }
  .fintech-dashboard .fin-focus-card .dash-todo-name {
    min-width: 0;
  }
  .fintech-dashboard .fin-focus-card .dash-todo-tag {
    max-width: min(170px, 32%);
  }

  /* Quick stats should never force the parent card wider than the workspace. */
  .fintech-dashboard .fin-stat-grid,
  .fintech-dashboard .fin-stat-card {
    min-width: 0;
  }
}

/* Content-width breakpoints: these react to the space left by the sidebar,
   not merely the physical viewport width. */
@container dashboard-workspace (max-width: 980px) {
  .fintech-dashboard .fin-hero-grid {
    grid-template-columns: minmax(270px, .95fr) minmax(340px, 1.15fr);
  }
  .fintech-dashboard .fin-quick-card {
    grid-column: 1 / -1;
    min-height: 0;
  }
  .fintech-dashboard .fin-quick-card .fin-stat-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@container dashboard-workspace (max-width: 760px) {
  .fintech-dashboard .fin-hero-grid {
    grid-template-columns: 1fr;
  }
  .fintech-dashboard .fin-quick-card {
    grid-column: auto;
  }
  .fintech-dashboard .fin-readiness-main {
    grid-template-columns: 112px minmax(0, 1fr);
  }
}

@container dashboard-workspace (max-width: 520px) {
  .fintech-dashboard .fin-readiness-main {
    grid-template-columns: 1fr;
  }
  .fintech-dashboard .fin-readiness-metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
EOF

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/app.css
          git rm .github/workflows/temp-layout-fix.yml
          git commit -m "fix: sidebar-aware dashboard cards [layout-fix-applied]"
          git push
