name: Build Turbo Proxy Image

on:
  push:
    branches:
      - main
    paths:
      - "youtube-turbo-proxy/**"
      - ".github/workflows/turbo-proxy-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: turbo-proxy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: purendar950/examen-planner-youtube-turbo-proxy

jobs:
  build-and-push:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./youtube-turbo-proxy
          file: ./youtube-turbo-proxy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
