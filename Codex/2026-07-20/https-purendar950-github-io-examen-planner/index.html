<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Transcript via NoteGPT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.25);
    padding: 40px;
    max-width: 800px;
    width: 100%;
  }
  h1 { font-size: 26px; color: #1a1a2e; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
  .input-group { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input[type="url"] {
    flex: 1; min-width: 200px;
    padding: 14px 18px; border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 14px; outline: none; transition: all 0.2s;
  }
  input:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
  button {
    padding: 14px 28px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .card {
    background: #f8f9fe; border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .card-title { font-size: 13px; font-weight: 700; color: #667eea; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .status-bar {
    padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px;
    display: none; line-height: 1.5;
  }
  .status-bar.info { background: #eef2ff; color: #4338ca; display: flex; align-items: center; gap: 8px; border-left: 4px solid #667eea; }
  .status-bar.success { background: #ecfdf5; color: #065f46; display: flex; align-items: center; gap: 8px; border-left: 4px solid #10b981; }
  .status-bar.warning { background: #fffbeb; color: #92400e; display: flex; align-items: center; gap: 8px; border-left: 4px solid #f59e0b; }
  .status-bar.error { background: #fef2f2; color: #991b1b; display: flex; align-items: center; gap: 8px; border-left: 4px solid #ef4444; }
  .transcript-box {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
    padding: 0; max-height: 520px; overflow-y: auto; display: none;
  }
  .transcript-box.show { display: block; }
  .transcript-item {
    padding: 10px 18px; border-bottom: 1px solid #f3f4f6;
    display: flex; gap: 14px; font-size: 14px; line-height: 1.7;
  }
  .transcript-item:hover { background: #f9fafb; }
  .transcript-item:last-child { border-bottom: none; }
  .timestamp {
    color: #667eea; font-weight: 600; min-width: 56px;
    font-family: monospace; font-size: 12px; padding-top: 1px;
    flex-shrink: 0; cursor: pointer;
  }
  .timestamp:hover { text-decoration: underline; }
  .text { color: #374151; }
  .meta-bar {
    display: flex; gap: 16px; font-size: 12px; color: #888;
    margin-bottom: 12px; align-items: center; flex-wrap: wrap;
  }
  .meta-bar .label { font-weight: 600; color: #555; }
  .actions-row { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .actions-row button {
    padding: 8px 16px; font-size: 12px;
    background: #f3f4f6; color: #374151; border-radius: 8px;
  }
  .actions-row button:hover { background: #e5e7eb; transform: none; box-shadow: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #e5e7eb; border-top-color: #667eea; border-radius: 50%; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 4px; margin-right: 4px;
  }
  .badge.ng { background: #667eea; color: white; }
  .badge.yt { background: #ef4444; color: white; }
  .badge.proxy { background: #10b981; color: white; }
  .hide { display: none !important; }
  .server-status {
    padding: 10px 14px; background: #f0fdf4; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px; border-left: 4px solid #10b981;
  }
  .server-status.error { background: #fef2f2; border-left-color: #ef4444; }
  details { margin-top: 16px; }
  summary { cursor: pointer; font-size: 12px; color: #aaa; user-select: none; }
  summary:hover { color: #667eea; }
  #debugLog {
    font-size: 11px; max-height: 200px; overflow: auto;
    background: #f9fafb; padding: 12px 16px; border-radius: 8px;
    margin-top: 8px; white-space: pre-wrap; font-family: monospace; color: #555; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 YouTube Transcript Tool</h1>
  <p class="subtitle">via NoteGPT + Proxy Server</p>

  <div id="serverStatus" class="server-status hide"></div>

  <div class="card">
    <div class="card-title">📺 YouTube URL</div>
    <div class="input-group">
      <input type="url" id="youtubeUrl" placeholder="e.g. https://www.youtube.com/watch?v=dQw4w9WgXcQ">
      <button id="fetchBtn" onclick="startFetch()">
        <span id="btnText">Get Transcript</span>
        <span id="btnSpinner" class="spinner hide"></span>
      </button>
    </div>
    <div id="videoPreview" class="hide" style="margin-top:12px;text-align:center;">
      <img id="thumbPreview" style="max-width:320px;width:100%;border-radius:8px;border:1px solid #eee;">
    </div>
  </div>

  <div id="statusBar" class="status-bar"></div>

  <div id="resultArea" class="hide">
    <div class="meta-bar">
      <span><span class="label">Source:</span> <span id="sourceLabel">—</span></span>
      <span><span class="label">Lines:</span> <span id="lineCount">0</span></span>
      <span><span class="label">Language:</span> <span id="langLabel">—</span></span>
    </div>
    <div id="transcriptBox" class="transcript-box"></div>
    <div class="actions-row">
      <button onclick="copyTranscript()">📋 Copy</button>
      <button onclick="downloadTranscript()">⬇️ Download</button>
    </div>
  </div>

  <details>
    <summary>⚙️ Debug Log</summary>
    <pre id="debugLog"></pre>
  </details>
</div>

<script>
// ============ CONFIG ============
const PROXY_BASE = '';  // Empty = same origin (proxy serves both API and HTML)
const NOTEAPT_EMAIL = 'purendar1chauhan@gmail.com';
const NOTEAPT_PASS = 'Man128pur@9454';

let accessToken = '';
let lastTranscriptData = null;
let lastVideoId = '';

// ============ LOGGING ============
function log(...args) {
  const el = document.getElementById('debugLog');
  el.textContent += '[' + new Date().toLocaleTimeString() + '] ' +
    args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ') + '\n';
}

function setStatus(html, type) {
  const el = document.getElementById('statusBar');
  el.innerHTML = html;
  el.className = 'status-bar ' + type;
}

function showLoading(on) {
  document.getElementById('btnSpinner').classList.toggle('hide', !on);
  document.getElementById('btnText').textContent = on ? 'Working...' : 'Get Transcript';
  document.getElementById('fetchBtn').disabled = on;
}

// ============ CHECK SERVER ============
async function checkServer() {
  const el = document.getElementById('serverStatus');
  try {
    const resp = await fetch(PROXY_BASE + '/api/transcript?videoId=test');
    // If we get any response, server is up
    el.className = 'server-status';
    el.innerHTML = '✅ <strong>Proxy server is running</strong> — All API calls will work';
    el.classList.remove('hide');
  } catch(e) {
    el.className = 'server-status error';
    el.innerHTML = '❌ <strong>Cannot reach proxy server</strong> — Make sure you\'ve started the Python proxy (see instructions below)';
    el.classList.remove('hide');
  }
}

// ============ PROXY API ============
async function proxyAPI(method, path, data = null, auth = false) {
  const headers = { 'Accept': 'application/json' };
  if (auth && accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
  if (data && method === 'POST') headers['Content-Type'] = 'application/json';

  const url = PROXY_BASE + path;
  log(`→ ${method} ${path}`);
  if (data) log(`  Body: ${JSON.stringify(data).substring(0, 200)}`);

  const resp = await fetch(url, {
    method, headers,
    body: data && method === 'POST' ? JSON.stringify(data) : undefined
  });
  const result = await resp.json();
  log(`← ${resp.status}`);
  return result;
}

// ============ METHOD 1: NoteGPT via Proxy ============
async function methodNoteGPT(videoId, url) {
  log('--- Method 1: NoteGPT API (via proxy) ---');

  // Login if needed
  if (!accessToken) {
    const loginResp = await proxyAPI('POST', '/api/notegpt/login', {
      email: NOTEAPT_EMAIL, password: NOTEAPT_PASS
    });
    if (loginResp.code === 100000) {
      accessToken = loginResp.data.access_token;
      log(`✅ Logged in as ${loginResp.data.user_name}`);
    } else {
      log(`Login failed: ${loginResp.message || loginResp.code}`);
      return null;
    }
  }

  // Try add-video
  const timestamp = Date.now();
  const cover = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
  
  const addResp = await proxyAPI('POST', '/api/notegpt/add-video', {
    created_at: timestamp, source_url: url,
    title: 'YT - ' + videoId, video_id: videoId,
    video_type: 'youtube', platform: 1, cover,
    updated_at: timestamp, extra_data: '{}',
    file_info: JSON.stringify({
      videoInfo: {}, cover, origin_url: url, title: 'YT', videoId, hasTranscript: false
    })
  }, true);

  if (addResp.code === 100000 && addResp.data?.video_id) {
    const infoResp = await proxyAPI('GET',
      `/api/notegpt/get-video-by-id?video_id=${addResp.data.video_id}`, null, true);
    
    if (infoResp.code === 100000 && infoResp.data) {
      const video = Array.isArray(infoResp.data) ? infoResp.data[0] : infoResp.data;
      if (video?.extra_data) {
        const extra = typeof video.extra_data === 'string' ? JSON.parse(video.extra_data) : video.extra_data;
        let tUrl = extra?.lang_options_with_link?.[0]?.data_link;
        if (!tUrl && extra?.text?.[0]) tUrl = extra.text[0].data_link;
        if (tUrl) {
          const fullUrl = tUrl.startsWith('http') ? tUrl : 'https:' + tUrl;
          const segs = await (await fetch(fullUrl)).json();
          return segs;
        }
      }
    }
  }
  log(`NoteGPT code ${addResp.code}: ${addResp.message}`);
  return null;
}

// ============ METHOD 2: YouTube Caption Fetch via Proxy ============
async function methodYouTubeProxy(videoId) {
  log('--- Method 2: YouTube Captions (via proxy) ---');

  const result = await proxyAPI('GET', `/api/transcript?videoId=${videoId}`);

  if (result.segments && result.segments.length > 0) {
    document.getElementById('sourceLabel').textContent = 'YouTube Captions (proxy)';
    document.getElementById('langLabel').textContent = '—';
    return result.segments;
  }
  
  if (result.error) {
    throw new Error(result.error);
  }
  return null;
}

// ============ VIDEO ID ============
function extractVideoId(url) {
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/watch\?.*[?&]v=([a-zA-Z0-9_-]{11})/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

// ============ MAIN ============
async function startFetch() {
  const url = document.getElementById('youtubeUrl').value.trim();
  if (!url) { setStatus('Please enter a YouTube URL', 'error'); return; }

  const videoId = extractVideoId(url);
  if (!videoId) {
    setStatus('Invalid YouTube URL. Use format: https://www.youtube.com/watch?v=...', 'error');
    return;
  }

  lastVideoId = videoId;
  document.getElementById('resultArea').classList.add('hide');
  document.getElementById('transcriptBox').classList.remove('show');
  document.getElementById('transcriptBox').innerHTML = '';
  document.getElementById('videoPreview').classList.remove('hide');
  document.getElementById('thumbPreview').src = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

  showLoading(true);
  log(`\n========== Fetching transcript for ${videoId} ==========`);

  try {
    // Method 1: NoteGPT
    setStatus('⏳ <span class="badge ng">NoteGPT</span> Trying NoteGPT...', 'info');
    let segments = await methodNoteGPT(videoId, url);

    if (!segments) {
      // Method 2: YouTube captions via proxy
      setStatus('⏳ <span class="badge proxy">Proxy</span> Fetching YouTube captions server-side...', 'info');
      try {
        segments = await methodYouTubeProxy(videoId);
      } catch(e) {
        log(`Method 2 error: ${e.message}`);
      }
    }

    if (segments && segments.length > 0) {
      renderTranscript(segments);
      setStatus('✅ Transcript fetched successfully!', 'success');
    } else {
      setStatus('❌ No captions available for this video. Try a different video that has captions enabled.', 'error');
    }
  } catch(e) {
    log(`Fatal: ${e.message}`);
    setStatus('❌ ' + e.message, 'error');
  } finally {
    showLoading(false);
  }
}

// ============ RENDER ============
function renderTranscript(segments) {
  lastTranscriptData = segments;
  const box = document.getElementById('transcriptBox');
  box.innerHTML = '';
  box.classList.add('show');

  segments.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'transcript-item';

    let seconds = 0;
    if (item.offset !== undefined) seconds = Math.floor(item.offset / 1000);
    else if (item.start !== undefined) seconds = Math.floor(item.start);
    else seconds = i;

    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;

    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    ts.onclick = () => window.open(`https://youtube.com/watch?v=${lastVideoId}&t=${seconds}s`, '_blank');
    ts.title = 'Jump to timestamp';
    div.appendChild(ts);

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text || item.content || '';
    div.appendChild(text);

    box.appendChild(div);
  });

  document.getElementById('lineCount').textContent = segments.length;
  document.getElementById('resultArea').classList.remove('hide');
}

// ============ UTILITIES ============
function copyTranscript() {
  if (!lastTranscriptData) return;
  const text = lastTranscriptData.map(s => s.text || s.content || '').join('\n');
  navigator.clipboard.writeText(text).then(() => {
    setStatus('📋 Copied to clipboard!', 'success');
    setTimeout(() => document.getElementById('statusBar').className = 'status-bar', 2000);
  });
}

function downloadTranscript() {
  if (!lastTranscriptData) return;
  const text = lastTranscriptData.map(s => {
    const secs = s.offset !== undefined ? Math.floor(s.offset / 1000) : (s.start !== undefined ? Math.floor(s.start) : 0);
    const m = Math.floor(secs / 60), s2 = secs % 60;
    return `[${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}] ${s.text || s.content || ''}`;
  }).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transcript.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ============ INIT ============
window.addEventListener('DOMContentLoaded', () => {
  checkServer();
});
</script>
</body>
</html>
