  <circle cx="142" cy="375" r="31" fill="#47DFF4" stroke="#07110F" stroke-width="12"/>
  <path d="M345 84L392 131L345 178L298 131Z" fill="#19E3A2" stroke="#D9FFF2" stroke-opacity="0.55" stroke-width="7"/>
  <circle cx="345" cy="131" r="14" fill="#07110F"/>
