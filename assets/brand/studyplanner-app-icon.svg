<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">StudyPlanner app icon</title>
  <desc id="desc">An S-shaped study path progressing from a blue starting point to a green goal.</desc>
  <defs>
    <linearGradient id="background" x1="44" y1="20" x2="468" y2="492" gradientUnits="userSpaceOnUse"><stop stop-color="#12372E"/><stop offset="0.48" stop-color="#091D18"/><stop offset="1" stop-color="#050D0B"/></linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(344 132) rotate(126) scale(322)" gradientUnits="userSpaceOnUse"><stop stop-color="#19E3A2" stop-opacity="0.18"/><stop offset="1" stop-color="#19E3A2" stop-opacity="0"/></radialGradient>
    <linearGradient id="route" x1="132" y1="382" x2="388" y2="125" gradientUnits="userSpaceOnUse"><stop stop-color="#47DFF4"/><stop offset="0.5" stop-color="#20E0BA"/><stop offset="1" stop-color="#19E3A2"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
