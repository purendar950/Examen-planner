    <text x="77" y="35" class="white" font-size="31" font-weight="850" letter-spacing="-1.2">Study<tspan class="green">Planner</tspan></text>
    <text x="79" y="54" fill="#70857D" font-size="9.5" font-weight="800" letter-spacing="2.2">PLAN  •  FOCUS  •  PROGRESS</text>
