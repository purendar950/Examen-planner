  <rect width="1080" height="1080" fill="url(#glowA)"/>
  <rect width="1080" height="1080" fill="url(#glowB)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>
  <circle cx="960" cy="300" r="155" fill="#19E3A2" opacity=".035"/><circle cx="108" cy="420" r="170" fill="#47DFF4" opacity=".025"/>

