<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">StudyPlanner YouTube and Telegram feature update promotional poster</title>
  <desc id="desc">A square promotional graphic featuring AI notes from YouTube, lecture quizzes, Telegram task scheduling, saved timestamp moments, and four supporting StudyPlanner tools.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="1010" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102923"/><stop offset="0.48" stop-color="#071713"/><stop offset="1" stop-color="#050D0B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(905 140) rotate(126) scale(620 500)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19E3A2" stop-opacity=".24"/><stop offset="1" stop-color="#19E3A2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(100 860) rotate(-28) scale(500 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47DFF4" stop-opacity=".16"/><stop offset="1" stop-color="#47DFF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#47DFF4"/><stop offset=".55" stop-color="#20E0BA"/><stop offset="1" stop-color="#19E3A2"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14251F"/><stop offset="1" stop-color="#0A1512"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1CE8AB"/><stop offset="1" stop-color="#00A977"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#B8FFE6" stroke-opacity=".025"/></pattern>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.caps{letter-spacing:2px}.muted{fill:#8EA39B}.white{fill:#F1FBF7}.green{fill:#19E3A2}.cyan{fill:#47DFF4}.card-title{fill:#EAF8F3;font-size:21px;font-weight:800}.card-copy{fill:#82978F;font-size:13px;font-weight:500}.ui-label{fill:#9CB0A8;font-size:11px;font-weight:700}.ui-value{fill:#F1FBF7;font-size:16px;font-weight:800}.tiny{fill:#70857D;font-size:9px;font-weight:600}
    </style>
  </defs>

