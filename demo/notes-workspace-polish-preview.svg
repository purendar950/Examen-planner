<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Polished StudyPlanner Generate Notes workspace</title>
  <desc id="desc">Desktop mock-up with a video player on the left and a polished Notes workspace on the right showing a calm AI generation loading card.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f1e"/>
      <stop offset="1" stop-color="#142b2b"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2e38"/>
      <stop offset="1" stop-color="#071318"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#fbf6e8"/>
    </linearGradient>
    <linearGradient id="load" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#edf1e9"/>
      <stop offset=".5" stop-color="#f9fbf5"/>
      <stop offset="1" stop-color="#edf1e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020b0b" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#20352b" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#page)"/>
  <circle cx="212" cy="132" r="320" fill="#2d795c" opacity=".1"/>
  <circle cx="1305" cy="790" r="330" fill="#d9c26a" opacity=".07"/>

  <rect x="56" y="34" width="1328" height="56" rx="16" fill="#183232" stroke="#31504b"/>
  <rect x="76" y="49" width="27" height="27" rx="8" fill="#b8da5c"/>
  <path d="M85 57h9v11h-9z" fill="#17322c"/><path d="M87 54h5v5h-5z" fill="#17322c"/>
  <text x="116" y="68" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f7f7ed">Study<tspan fill="#b8da5c">Planner</tspan></text>
  <text x="270" y="67" font-family="Arial, sans-serif" font-size="13" fill="#a9beb6">YouTube Study Workspace</text>
  <rect x="1194" y="49" width="166" height="28" rx="14" fill="#24413d"/>
  <circle cx="1212" cy="63" r="5" fill="#b8da5c"/>
  <text x="1225" y="68" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#dcebe4">AI Study is ready</text>

  <text x="58" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b8da5c" letter-spacing="1.8">LECTURE WORKSPACE</text>
  <text x="58" y="159" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f7f7ed">Learn alongside your notes</text>
  <text x="58" y="182" font-family="Arial, sans-serif" font-size="14" fill="#a9beb6">Keep the lecture visible while AI turns captions into structured revision material.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="210" width="756" height="586" rx="20" fill="#122829" stroke="#35514e"/>
    <rect x="836" y="210" width="548" height="586" rx="20" fill="#e7e1d1" stroke="#d8cfbb"/>
  </g>

  <clipPath id="videoClip"><rect x="72" y="226" width="724" height="407" rx="13"/></clipPath>
  <g clip-path="url(#videoClip)">
    <rect x="72" y="226" width="724" height="407" fill="url(#video)"/>
    <path d="M72 543 C200 435 305 613 443 489 S681 472 796 375 V633 H72Z" fill="#173b3b"/>
    <path d="M72 573 C216 498 330 623 480 524 S654 531 796 447 V633 H72Z" fill="#1d5048" opacity=".8"/>
    <rect x="118" y="276" width="212" height="32" rx="16" fill="#132d2d" opacity=".84"/>
    <circle cx="139" cy="292" r="6" fill="#ee6554"/>
    <text x="153" y="297" font-family="Arial, sans-serif" font-size="13" fill="#ecf1e8">Introduction to Organic Chemistry</text>
    <circle cx="434" cy="417" r="42" fill="#f4f7ed" opacity=".93"/>
    <path d="M423 396 L423 438 L456 417 Z" fill="#1a6653"/>
    <rect x="72" y="583" width="724" height="50" fill="#0b191d" opacity=".88"/>
    <rect x="96" y="602" width="486" height="4" rx="2" fill="#60756f"/>
    <rect x="96" y="602" width="246" height="4" rx="2" fill="#b8da5c"/>
    <path d="M103 615 L103 627 L114 621 Z" fill="#f7f7ed"/>
    <text x="128" y="626" font-family="Arial, sans-serif" font-size="12" fill="#eaf0e9">08:11 / 24:36</text>
    <rect x="690" y="612" width="74" height="19" rx="5" fill="#24423e"/>
    <text x="704" y="626" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#dcebe4">HD 1080p</text>
  </g>

  <text x="80" y="672" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f4f7ed">Organic Chemistry — Lecture 04</text>
  <text x="80" y="697" font-family="Arial, sans-serif" font-size="13" fill="#a9beb6">Chemical bonding and hybridisation</text>
  <rect x="80" y="724" width="131" height="34" rx="17" fill="#244a41" stroke="#3b6c5c"/>
  <circle cx="99" cy="741" r="5" fill="#b8da5c"/>
  <text x="111" y="746" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e7f2e8">Following lecture</text>
  <rect x="224" y="724" width="110" height="34" rx="17" fill="#183433" stroke="#35514e"/>
  <text x="248" y="746" font-family="Arial, sans-serif" font-size="12" fill="#d4e0da">Captions on</text>

  <rect x="852" y="226" width="516" height="554" rx="14" fill="url(#paper)"/>
  <rect x="852" y="226" width="516" height="54" rx="14" fill="#f6f3e9"/>
  <path d="M852 266H1368" stroke="#e6dec9"/>
  <text x="874" y="249" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#273a32">Generate Notes</text>
  <text x="874" y="267" font-family="Arial, sans-serif" font-size="11" fill="#718078">Turn this lecture into revision-ready material</text>
  <rect x="1264" y="239" width="83" height="27" rx="13" fill="#e6f0e4"/>
  <text x="1280" y="257" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#397052">Notes</text>

  <rect x="872" y="297" width="112" height="30" rx="9" fill="#e9f0e4" stroke="#d5e1cf"/>
  <text x="888" y="317" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3c6850">Topic notes</text>
  <path d="M965 309l5 5 5-5" fill="none" stroke="#527460" stroke-width="1.5"/>
  <rect x="994" y="297" width="91" height="30" rx="9" fill="#fffdf6" stroke="#ddd6c3"/>
  <text x="1011" y="317" font-family="Arial, sans-serif" font-size="12" fill="#526159">English</text>
  <path d="M1065 309l5 5 5-5" fill="none" stroke="#527460" stroke-width="1.5"/>
  <rect x="1187" y="297" width="160" height="30" rx="9" fill="#f0f4ee" stroke="#d9e3d7"/>
  <text x="1203" y="317" font-family="Arial, sans-serif" font-size="11" fill="#5c7265">Captions detected</text>
  <circle cx="1328" cy="312" r="4" fill="#70ac66"/>

  <rect x="922" y="374" width="376" height="245" rx="18" fill="#fffefb" stroke="#e0d8c5" filter="url(#soft)"/>
  <text x="1110" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#62816b">AI STUDY</text>
  <circle cx="1110" cy="445" r="17" fill="none" stroke="#d5e8d8" stroke-width="3"/>
  <path d="M1110 428 A17 17 0 0 1 1127 445" fill="none" stroke="#25824b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="1110" cy="445" r="5" fill="#b7d75d"/>
  <text x="1110" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#233c2d">Preparing your notes</text>
  <text x="1110" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#708078">Reviewing lecture captions in English.</text>
  <text x="1110" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#708078">You can keep watching while your notebook is prepared.</text>
  <rect x="1004" y="561" width="212" height="7" rx="3.5" fill="url(#load)"/>
  <rect x="1024" y="576" width="172" height="7" rx="3.5" fill="url(#load)"/>
  <rect x="1048" y="591" width="124" height="7" rx="3.5" fill="url(#load)"/>

  <rect x="872" y="722" width="150" height="38" rx="10" fill="#2c8250"/>
  <text x="947" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fffef9">Generate Notes</text>
  <rect x="1032" y="722" width="126" height="38" rx="10" fill="#fffdf6" stroke="#d9d0bc"/>
  <text x="1095" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4e6257">Course view</text>
  <text x="1348" y="746" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#7d8b82">Captions power this notebook</text>

  <rect x="56" y="827" width="1328" height="40" rx="12" fill="#173130" opacity=".82"/>
  <circle cx="80" cy="847" r="5" fill="#b8da5c"/>
  <text x="95" y="852" font-family="Arial, sans-serif" font-size="12" fill="#d6e5dd">Parallel desktop workspace: lecture on the left, focused note creation on the right.</text>
  <text x="1360" y="852" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#b8da5c">POLISHED PREVIEW</text>
</svg>
