<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Cone formed by rolling a sector</title>
  <desc id="desc">A circular sector rolls into a cone, mapping sector radius to slant height and sector arc length to the cone base circumference.</desc>
  <rect width="760" height="360" rx="24" fill="#f8fafc"/>
  <path d="M82 274 L195 80 A220 220 0 0 1 310 274 Z" fill="#ccfbf1" stroke="#0f766e" stroke-width="5"/>
  <path d="M195 80 L82 274 M195 80 L310 274" stroke="#0f766e" stroke-width="4"/>
  <path d="M154 150 A81 81 0 0 1 236 150" stroke="#f97316" stroke-width="5" fill="none"/>
  <path d="M365 180 H455" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
  <ellipse cx="595" cy="278" rx="92" ry="25" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
  <path d="M503 278 L595 64 L687 278" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="5"/>
  <path d="M595 64 V278" stroke="#f97316" stroke-width="4" stroke-dasharray="8 7"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a" font-weight="700">
    <text x="186" y="130" font-size="23" fill="#f97316">θ</text>
    <text x="96" y="170" font-size="22">sector radius = l</text>
    <text x="135" y="315" font-size="20" fill="#475569">arc length</text>
    <text x="630" y="160" font-size="23">l</text>
    <text x="607" y="192" font-size="23" fill="#f97316">h</text>
    <text x="620" y="302" font-size="23">r</text>
    <text x="462" y="332" font-size="18" fill="#475569">arc length = 2πr</text>
  </g>
</svg>
