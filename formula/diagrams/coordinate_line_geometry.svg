<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Coordinate geometry for area, slope, and line distance</title>
  <desc id="desc">Three coordinate panels show a triangle used for coordinate area, parallel and perpendicular line slopes, and the perpendicular distance from a point to a line.</desc>
  <rect width="960" height="410" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a">
    <g transform="translate(25 30)"><rect width="285" height="345" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/><path d="M35 280 H255 M55 310 V55" stroke="#94a3b8" stroke-width="3"/><path d="M80 245 L145 92 L238 225 Z" fill="#dbeafe" fill-opacity=".7" stroke="#2563eb" stroke-width="5"/><circle cx="80" cy="245" r="6"/><circle cx="145" cy="92" r="6"/><circle cx="238" cy="225" r="6"/><text x="70" y="267" font-size="18" font-weight="700">A</text><text x="147" y="84" font-size="18" font-weight="700">B</text><text x="244" y="229" font-size="18" font-weight="700">C</text><text x="143" y="35" text-anchor="middle" font-size="20" font-weight="800">Coordinate area</text><text x="143" y="325" text-anchor="middle" font-size="16" fill="#475569">determinant = twice area</text></g>
    <g transform="translate(337 30)"><rect width="285" height="345" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/><path d="M35 280 H255 M55 310 V55" stroke="#94a3b8" stroke-width="3"/><path d="M55 235 L245 90 M55 275 L245 130" stroke="#16a34a" stroke-width="5"/><path d="M80 80 L225 270" stroke="#7c3aed" stroke-width="5"/><path d="M144 176 L158 187 L169 173" fill="none" stroke="#dc2626" stroke-width="3"/><text x="143" y="35" text-anchor="middle" font-size="20" font-weight="800">Slope relations</text><text x="143" y="325" text-anchor="middle" font-size="16" fill="#475569">parallel: m₁=m₂ · perpendicular: m₁m₂=−1</text></g>
    <g transform="translate(649 30)"><rect width="285" height="345" rx="18" fill="#faf5ff" stroke="#e9d5ff" stroke-width="3"/><path d="M35 280 H255 M55 310 V55" stroke="#94a3b8" stroke-width="3"/><path d="M55 245 L245 105" stroke="#7c3aed" stroke-width="5"/><circle cx="92" cy="92" r="8" fill="#f97316"/><path d="M92 92 L150 175" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/><path d="M141 169 L151 160 L161 168" fill="none" stroke="#dc2626" stroke-width="3"/><text x="72" y="84" font-size="20" font-weight="700">P</text><text x="143" y="35" text-anchor="middle" font-size="20" font-weight="800">Point-to-line distance</text><text x="143" y="325" text-anchor="middle" font-size="16" fill="#475569">shortest path is perpendicular</text></g>
  </g>
</svg>
