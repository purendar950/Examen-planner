<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Cuboid folding, dimensions, and body diagonal</title>
  <desc id="desc">Three panels show a rectangular net folding into a cuboid, the cuboid dimensions length breadth and height, and the longest body diagonal.</desc>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a">
    <g transform="translate(25 28)">
      <rect width="285" height="360" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
      <g fill="#dbeafe" stroke="#2563eb" stroke-width="3"><rect x="25" y="135" width="58" height="58"/><rect x="83" y="135" width="58" height="58"/><rect x="141" y="135" width="58" height="58"/><rect x="199" y="135" width="58" height="58"/><rect x="83" y="77" width="58" height="58"/><rect x="83" y="193" width="58" height="58"/></g>
      <path d="M165 80 C220 55 245 85 240 115" fill="none" stroke="#f97316" stroke-width="5" marker-end="url(#arrow2)"/>
      <text x="70" y="45" font-size="20" font-weight="800">Fold the net</text><text x="48" y="300" font-size="17" fill="#475569">faces meet at edges</text>
    </g>
    <g transform="translate(337 28)">
      <rect width="285" height="360" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/>
      <path d="M55 110 L185 110 L235 75 L105 75 Z M55 110 V255 L185 255 V110 M185 255 L235 220 V75 M55 255 L105 220 M105 75 V220 H235" fill="#dcfce7" fill-opacity=".55" stroke="#16a34a" stroke-width="4"/>
      <text x="112" y="279" font-size="20" font-weight="700">L</text><text x="202" y="250" font-size="20" font-weight="700">b</text><text x="34" y="188" font-size="20" font-weight="700">h</text>
      <text x="64" y="45" font-size="20" font-weight="800">Key dimensions</text><text x="65" y="320" font-size="17" fill="#475569">V = L × b × h</text>
    </g>
    <g transform="translate(649 28)">
      <rect width="285" height="360" rx="18" fill="#faf5ff" stroke="#e9d5ff" stroke-width="3"/>
      <path d="M45 110 L185 110 L240 75 L100 75 Z M45 110 V255 L185 255 V110 M185 255 L240 220 V75 M45 255 L100 220 M100 75 V220 H240" fill="#ede9fe" fill-opacity=".55" stroke="#7c3aed" stroke-width="4"/>
      <path d="M45 255 L240 75" stroke="#dc2626" stroke-width="6"/>
      <text x="72" y="45" font-size="20" font-weight="800">Body diagonal</text><text x="50" y="304" font-size="17" fill="#475569">d = √(L² + b² + h²)</text><text x="63" y="330" font-size="16" fill="#475569">longest rod inside</text>
    </g>
  </g>
  <defs><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#f97316"/></marker></defs>
</svg>
