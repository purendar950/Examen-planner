<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Frustum dimensions and slant height</title>
  <desc id="desc">A conical frustum labels upper radius r, lower radius R, vertical height h, slant height l, and the right triangle with horizontal side R minus r.</desc>
  <rect width="720" height="360" rx="24" fill="#f8fafc"/>
  <ellipse cx="245" cy="88" rx="72" ry="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <ellipse cx="245" cy="280" rx="132" ry="35" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/>
  <path d="M173 88 L113 280 M317 88 L377 280" stroke="#2563eb" stroke-width="5" fill="#dbeafe" fill-opacity=".45"/>
  <path d="M245 88 V280 M245 88 H317 M245 280 H377" stroke="#f97316" stroke-width="4" stroke-dasharray="8 7"/>
  <path d="M474 280 V112 L600 280 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
  <path d="M474 248 H506 V280" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a" font-weight="700">
    <text x="273" y="78" font-size="24">r</text>
    <text x="311" y="304" font-size="24">R</text>
    <text x="214" y="190" font-size="24" fill="#f97316">h</text>
    <text x="352" y="185" font-size="24" fill="#2563eb">l</text>
    <text x="458" y="196" font-size="24">h</text>
    <text x="544" y="313" font-size="22">R − r</text>
    <text x="548" y="188" font-size="24" fill="#7c3aed">l</text>
    <text x="430" y="72" font-size="23" fill="#7c3aed">l² = h² + (R − r)²</text>
    <text x="431" y="102" font-size="18" fill="#475569">Use the radius difference</text>
  </g>
</svg>
