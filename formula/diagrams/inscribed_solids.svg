<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">Maximum solids fitted inside other solids</title>
  <desc id="desc">Six panels show a cone in a cylinder, sphere in a cylinder, cylinder in a cube, sphere in a cube, solids in a cone, and a cube in a hemisphere.</desc>
  <rect width="1080" height="520" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif" fill="#0f172a" text-anchor="middle">
    <g transform="translate(25 25)"><rect width="320" height="215" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/><ellipse cx="160" cy="58" rx="72" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M88 58 V165 M232 58 V165" stroke="#2563eb" stroke-width="4"/><ellipse cx="160" cy="165" rx="72" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M160 58 L88 165 M160 58 L232 165" stroke="#f97316" stroke-width="5"/><text x="160" y="202" font-size="18" font-weight="800">Cone in cylinder: same r, h</text></g>
    <g transform="translate(380 25)"><rect width="320" height="215" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/><ellipse cx="160" cy="48" rx="72" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><path d="M88 48 V170 M232 48 V170" stroke="#16a34a" stroke-width="4"/><ellipse cx="160" cy="170" rx="72" ry="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><circle cx="160" cy="109" r="61" fill="#cffafe" fill-opacity=".7" stroke="#0891b2" stroke-width="4"/><text x="160" y="202" font-size="18" font-weight="800">Sphere in cylinder: h = 2r</text></g>
    <g transform="translate(735 25)"><rect width="320" height="215" rx="18" fill="#faf5ff" stroke="#e9d5ff" stroke-width="3"/><path d="M75 58 H220 L248 38 H103 Z M75 58 V174 H220 V58 M220 174 L248 154 V38 M75 174 L103 154 M103 38 V154 H248" fill="#ede9fe" fill-opacity=".5" stroke="#7c3aed" stroke-width="4"/><ellipse cx="160" cy="61" rx="58" ry="15" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><path d="M102 61 V158 M218 61 V158" stroke="#ea580c" stroke-width="3"/><ellipse cx="160" cy="158" rx="58" ry="15" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><text x="160" y="202" font-size="18" font-weight="800">Cylinder in cube: h = a, 2r = a</text></g>
    <g transform="translate(25 275)"><rect width="320" height="215" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/><path d="M75 58 H220 L248 38 H103 Z M75 58 V174 H220 V58 M220 174 L248 154 V38 M75 174 L103 154 M103 38 V154 H248" fill="#ffedd5" fill-opacity=".45" stroke="#ea580c" stroke-width="4"/><circle cx="160" cy="106" r="58" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="4"/><path d="M102 48 L218 164" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 6"/><text x="160" y="202" font-size="18" font-weight="800">Sphere ↔ cube: diameter = edge</text></g>
    <g transform="translate(380 275)"><rect width="320" height="215" rx="18" fill="#ecfeff" stroke="#a5f3fc" stroke-width="3"/><ellipse cx="160" cy="174" rx="100" ry="25" fill="#cffafe" stroke="#0891b2" stroke-width="4"/><path d="M160 34 L60 174 M160 34 L260 174" stroke="#0891b2" stroke-width="5"/><circle cx="160" cy="126" r="45" fill="#dcfce7" fill-opacity=".7" stroke="#16a34a" stroke-width="4"/><rect x="113" y="102" width="94" height="72" fill="#fef3c7" fill-opacity=".55" stroke="#d97706" stroke-width="3"/><text x="160" y="202" font-size="18" font-weight="800">Sphere / cylinder / cube in cone</text></g>
    <g transform="translate(735 275)"><rect width="320" height="215" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="3"/><path d="M55 165 A105 105 0 0 1 265 165" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/><path d="M55 165 H265" stroke="#dc2626" stroke-width="5"/><rect x="112" y="75" width="96" height="90" fill="#dbeafe" fill-opacity=".72" stroke="#2563eb" stroke-width="4"/><path d="M160 165 L208 75" stroke="#f97316" stroke-width="3" stroke-dasharray="7 6"/><text x="160" y="202" font-size="18" font-weight="800">Cube in hemisphere: top corner on arc</text></g>
  </g>
</svg>
