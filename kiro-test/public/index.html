<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiro Key Test</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, monospace; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; min-height: 80px; }
  button { margin-top: 10px; padding: 8px 16px; }
  button:disabled { opacity: 0.5; cursor: default; }
  pre { background: #f2f1ec; padding: 12px; white-space: pre-wrap; word-break: break-word; min-height: 40px; }
  .err { color: #a3372c; }
</style>
</head>
<body>
  <h1>Kiro key test</h1>
  <p>Sends a prompt to the backend, which calls kiro-cli. The key itself stays server-side.</p>
  <textarea id="prompt">Say hello and confirm you are working.</textarea>
  <button id="send">Send to Kiro</button>
  <div id="status"></div>
  <pre id="output">Response will appear here.</pre>
  <script>
    const btn = document.getElementById('send');
    const promptEl = document.getElementById('prompt');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Waiting for response...';
      output.textContent = '';
      output.classList.remove('err');
      try {
        const res = await fetch('/api/test-kiro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptEl.value })
        });
        const data = await res.json();
        if (data.ok) {
          output.textContent = data.response;
          status.textContent = 'Success.';
        } else {
          output.textContent = data.error || 'Unknown error.';
          output.classList.add('err');
          status.textContent = 'Request failed.';
        }
      } catch (err) {
        output.textContent = err.message;
        output.classList.add('err');
        status.textContent = 'Network error.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
