<!-- Shared Note Focus Mode — loaded globally by app.html. -->
<style>
  #note-focus-view {
    position: fixed;
    inset: 0;
    z-index: 10050;
    display: none;
    flex-direction: column;
    background: var(--surface, #121720);
    color: var(--text, #e7ecf5);
  }
  #note-focus-view.open { display: flex; }
  body.nf-lock { overflow: hidden; }

  .nf-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border, #2a3140);
    background: var(--card, #151a24);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .16);
  }
  .nf-toolbar button {
    min-height: 34px;
    padding: 6px 10px;
    border: 1px solid var(--border, #2a3140);
    border-radius: 8px;
    background: var(--surface, #1b1f2a);
    color: var(--text, #e7ecf5);
    cursor: pointer;
    font: inherit;
    font-size: .82rem;
    line-height: 1;
  }
  .nf-toolbar button:hover:not(:disabled), .nf-toolbar button:focus-visible {
    border-color: var(--accent, #00c896);
    outline: none;
  }
  .nf-toolbar button:focus-visible, .nf-color:focus-visible { outline: 2px solid var(--accent, #00c896); outline-offset: 2px; }
  .nf-toolbar button.active { background: var(--accent, #00c896); border-color: var(--accent, #00c896); color: #062018; }
  .nf-toolbar .nf-exit { margin-left: auto; }
  .nf-separator { width: 1px; height: 24px; background: var(--border, #2a3140); margin: 0 2px; }
  .nf-colors { display: inline-flex; align-items: center; gap: 5px; }
  .nf-color {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 2px solid transparent;
    border-radius: 50%;
    cursor: pointer;
  }
  .nf-color.active { border-color: var(--text, #e7ecf5); box-shadow: 0 0 0 1px var(--card, #151a24); }

  .nf-scroll {
    flex: 1 1 auto;
    overflow: auto;
    overscroll-behavior: contain;
    padding: clamp(16px, 4vw, 44px);
  }
  .nf-paper {
    position: relative;
    width: min(100%, 980px);
    min-height: 100%;
    box-sizing: border-box;
    margin: 0 auto;
    padding: clamp(22px, 5vw, 52px);
    border: 1px solid var(--border, #2a3140);
    border-radius: 16px;
    background: var(--card, #151a24);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .14);
  }
  .nf-note-content { position: relative; z-index: 1; }
  .nf-kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; color: var(--muted, #8b93a7); font-size: .75rem; }
  .nf-kicker strong { color: var(--accent, #00c896); font-size: .68rem; letter-spacing: .09em; }
  .nf-note-id { max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text, #e7ecf5); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .nf-access { margin-left: auto; }
  .nf-note-title {
    margin: 0 0 16px;
    padding: 3px 4px;
    border-radius: 5px;
    color: var(--text, #e7ecf5);
    font-size: clamp(1.35rem, 3vw, 2rem);
    line-height: 1.22;
    outline: none;
  }
  .nf-note-body {
    min-height: 16rem;
    padding: 3px 4px;
    border-radius: 5px;
    color: var(--text, #e7ecf5);
    font-size: clamp(1rem, 2vw, 1.1rem);
    line-height: 1.75;
    overflow-wrap: anywhere;
    outline: none;
  }
  .nf-note-title[contenteditable="true"], .nf-note-body[contenteditable="true"] {
    cursor: text;
    background: color-mix(in srgb, var(--accent, #00c896) 8%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent, #00c896) 55%, transparent);
  }
  .nf-note-body[contenteditable="true"] { min-height: 18rem; }
  .nf-canvas {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }
  .nf-canvas.is-eraser { cursor: cell; }
  /* The canvas is hidden while a draft is being edited, so old marks never
     appear to annotate unsaved or remotely changed text. */
  .nf-editing .nf-canvas { display: none; pointer-events: none; }
  .nf-editing .nf-note-content { user-select: text; }

  @media (max-width: 720px) {
    .nf-toolbar { gap: 4px; padding: 7px 8px; }
    .nf-toolbar button { min-height: 32px; padding: 6px 8px; font-size: .77rem; }
    .nf-toolbar .nf-exit { margin-left: 0; }
    .nf-separator { display: none; }
    .nf-scroll { padding: 10px; }
    .nf-paper { min-height: calc(100vh - 160px); padding: 22px 18px; border-radius: 12px; }
    .nf-kicker { gap: 5px; }
    .nf-access { width: 100%; margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .nf-toolbar button { transition: none; } }
</style>

<div id="note-focus-view" aria-hidden="true" aria-label="Shared note focus mode" role="dialog" aria-modal="true">
  <div class="nf-toolbar" role="toolbar" aria-label="Private marks and shared note controls">
    <button id="nf-close" class="nf-exit" type="button" onclick="nfClose()" title="Exit shared note focus mode">← Exit</button>
    <span class="nf-separator" aria-hidden="true"></span>
    <button id="nf-edit" type="button" onclick="nfSetEditing(true)" title="Edit the shared text" hidden>✎ Edit text</button>
    <button id="nf-save" type="button" onclick="nfSaveText()" title="Save shared text" hidden>☁ Save text</button>
    <button type="button" onclick="nfCopyNoteId()" title="Copy this note ID to share with a study partner">🔗 Share ID</button>
    <button type="button" onclick="nfOpenSharedNotePrompt()" title="Open a shared note using its ID">⌕ Open ID</button>
    <span class="nf-separator" aria-hidden="true"></span>
    <button class="nf-tool" data-tool="move" type="button" onclick="nfSetTool('move')" title="Scroll and select text">✋ Move</button>
    <button class="nf-tool active" data-tool="pen" type="button" onclick="nfSetTool('pen')" title="Private pen">✏️ Pen</button>
    <button class="nf-tool" data-tool="highlight" type="button" onclick="nfSetTool('highlight')" title="Private highlighter">🖍 Highlight</button>
    <button class="nf-tool" data-tool="eraser" type="button" onclick="nfSetTool('eraser')" title="Erase intersecting private marks">⌫ Erase</button>
    <span class="nf-separator" aria-hidden="true"></span>
    <span class="nf-colors" aria-label="Ink color">
      <button class="nf-color active" type="button" style="background:#EF4444" aria-label="Red ink" onclick="nfSetColor('#EF4444', this)"></button>
      <button class="nf-color" type="button" style="background:#F59E0B" aria-label="Orange ink" onclick="nfSetColor('#F59E0B', this)"></button>
      <button class="nf-color" type="button" style="background:#00C896" aria-label="Green ink" onclick="nfSetColor('#00C896', this)"></button>
      <button class="nf-color" type="button" style="background:#3B82F6" aria-label="Blue ink" onclick="nfSetColor('#3B82F6', this)"></button>
      <button class="nf-color" type="button" style="background:#A855F7" aria-label="Purple ink" onclick="nfSetColor('#A855F7', this)"></button>
    </span>
    <span class="nf-separator" aria-hidden="true"></span>
    <button type="button" onclick="nfUndo()" title="Undo your last private mark">↶</button>
    <button type="button" onclick="nfRedo()" title="Redo your last private mark">↷</button>
    <button type="button" onclick="nfClear()" title="Clear all of your private marks">🗑 Clear marks</button>
  </div>

  <div id="nf-scroll" class="nf-scroll">
    <article id="nf-paper" class="nf-paper">
      <div class="nf-note-content">
        <div class="nf-kicker">
          <strong>SHARED NOTE</strong>
          <span id="nf-note-id" class="nf-note-id">Loading…</span>
          <span id="nf-note-access" class="nf-access">Loading permissions…</span>
        </div>
        <h1 id="nf-note-title" class="nf-note-title" contenteditable="false" onpaste="nfPlainTextPaste(event)">Loading note…</h1>
        <div id="nf-note-body" class="nf-note-body" contenteditable="false" onpaste="nfPlainTextPaste(event)"></div>
      </div>
      <canvas id="nf-canvas" class="nf-canvas" aria-label="Your private pen and highlighter marks"></canvas>
    </article>
  </div>
</div>
