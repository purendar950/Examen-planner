<div class="page" id="page-saved">
  <style>
  /* ════════ QUIZ (SAVED QUESTIONS) TAB — scoped styles (sq- prefix) ════════ */
  #page-saved .sq-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:1.1rem; }
  #page-saved .sq-title { margin:0; font-size:1.25rem; font-weight:800; }
  #page-saved .sq-sub { font-size:.78rem; color:var(--muted); margin-top:2px; }
  #page-saved .sq-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #page-saved .sq-select { padding:.45rem .7rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:.82rem; max-width:260px; }
  #page-saved .sq-btn { padding:.45rem .8rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:.82rem; cursor:pointer; font-weight:600; }
  #page-saved .sq-btn:hover { border-color:var(--accent); color:var(--accent); }
  #page-saved .sq-btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #page-saved .sq-btn-primary:hover { filter:brightness(1.05); color:#fff; }
  #page-saved .sq-btn:disabled { opacity:.5; cursor:not-allowed; }

  /* ── sub-tabs ── */
  #page-saved .sq-subtabs { display:inline-flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px; margin-bottom:1.2rem; }
  #page-saved .sq-subtab { padding:9px 18px; border-radius:9px; font-size:.84rem; font-weight:600; color:var(--muted); cursor:pointer; border:none; background:transparent; transition:all .18s; display:inline-flex; align-items:center; gap:7px; }
  #page-saved .sq-subtab.active { background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(0,200,150,.28); }
  #page-saved .sq-view { display:none; }
  #page-saved .sq-view.active { display:block; }

  #page-saved .sq-list { display:flex; flex-direction:column; gap:14px; }
  #page-saved .sq-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  #page-saved .sq-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
  #page-saved .sq-quiz { font-size:.72rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
  #page-saved .sq-when { font-size:.68rem; color:var(--muted); margin-top:2px; }
  #page-saved .sq-remove { background:none; border:1px solid rgba(220,53,69,.4); color:#dc3545; border-radius:8px; padding:.3rem .6rem; font-size:.74rem; cursor:pointer; font-weight:600; white-space:nowrap; }
  #page-saved .sq-remove:hover { background:rgba(220,53,69,.12); }
  #page-saved .sq-q { font-size:.95rem; line-height:1.6; margin-bottom:12px; }
  #page-saved .sq-q img { max-width:90%; max-height:240px; height:auto; display:block; margin:10px auto; border:1px solid var(--border); border-radius:6px; }
  #page-saved .sq-opts { display:flex; flex-direction:column; gap:7px; margin-bottom:12px; }
  #page-saved .sq-opt { display:flex; gap:9px; align-items:flex-start; padding:8px 11px; border:1px solid var(--border); border-radius:8px; font-size:.86rem; line-height:1.5; }
  #page-saved .sq-opt .sq-optnum { font-weight:700; color:var(--muted); flex:0 0 auto; }
  #page-saved .sq-opt.correct { border-color:rgba(25,135,84,.55); background:rgba(25,135,84,.1); }
  #page-saved .sq-opt.correct .sq-optnum { color:#198754; }
  #page-saved .sq-opt img { max-width:160px; max-height:90px; height:auto; border-radius:4px; border:1px solid var(--border); margin-top:6px; display:block; }
  #page-saved .sq-exp { border-top:1px dashed var(--border); padding-top:10px; font-size:.84rem; line-height:1.6; color:var(--text); }
  #page-saved .sq-exp-label { font-weight:700; color:#198754; margin-bottom:4px; }
  #page-saved .sq-empty { text-align:center; padding:48px 20px; color:var(--muted); }
  #page-saved .sq-empty-icon { font-size:2.4rem; margin-bottom:10px; }
  #page-saved .sq-empty h3 { margin:0 0 6px; color:var(--text); font-weight:700; }
  #page-saved .sq-loading { text-align:center; padding:40px; color:var(--muted); }

  /* ── Attempt-Quiz view: available quiz cards ── */
  #page-saved .sq-qz-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:20px; }
  #page-saved .sq-qz-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:15px 16px; display:flex; flex-direction:column; gap:10px; }
  #page-saved .sq-qz-title { font-weight:700; font-size:.92rem; line-height:1.4; }
  #page-saved .sq-qz-meta { font-size:.74rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 12px; }
  #page-saved .sq-qz-best { font-size:.72rem; color:#198754; font-weight:700; }
  #page-saved .sq-section-label { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin:0 0 12px; }

  /* ── Available: playlist groups + shared-quiz cards ── */
  #page-saved .sq-pl-group { margin-bottom:22px; }
  #page-saved .sq-pl-head { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  #page-saved .sq-pl-ico { font-size:1.05rem; }
  #page-saved .sq-pl-name { font-weight:800; font-size:.98rem; }
  #page-saved .sq-pl-count { font-size:.66rem; color:var(--muted); background:var(--card,rgba(127,127,127,.12)); border:1px solid var(--border); padding:2px 8px; border-radius:99px; white-space:nowrap; }
  #page-saved .sq-qz-by { font-size:.7rem; color:var(--muted); }
  #page-saved .sq-shared-badge { display:inline-block; font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:1px 6px; border-radius:5px; background:rgba(168,85,247,.16); color:#A855F7; }
  #page-saved .sq-lock { background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:18px; text-align:center; color:var(--muted); margin-bottom:20px; }
  #page-saved .sq-lock b { color:var(--text); }

  /* ── Attempt history ── */
  #page-saved .sq-hist { display:flex; flex-direction:column; gap:10px; }
  #page-saved .sq-hist-row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 14px; cursor:pointer; transition:border-color .15s; }
  #page-saved .sq-hist-row:hover { border-color:var(--accent); }
  #page-saved .sq-hist-main { min-width:0; }
  #page-saved .sq-hist-title { font-weight:700; font-size:.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #page-saved .sq-hist-tag { display:inline-block; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:1px 6px; border-radius:5px; margin-right:6px; vertical-align:middle; background:rgba(127,127,127,.16); color:var(--muted); }
  #page-saved .sq-hist-tag.mock { background:rgba(11,94,215,.16); color:#3B82F6; }
  #page-saved .sq-hist-sub { font-size:.7rem; color:var(--muted); margin-top:2px; }
  #page-saved .sq-hist-score { flex:0 0 auto; text-align:right; }
  #page-saved .sq-hist-acc { font-size:1.05rem; font-weight:800; }
  #page-saved .sq-hist-pts { font-size:.68rem; color:var(--muted); }

  /* ── Saved view: quiz-wise groups ── */
  #page-saved .sq-group { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:14px; overflow:hidden; }
  #page-saved .sq-group-head { display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; user-select:none; }
  #page-saved .sq-group-head:hover { background:rgba(127,127,127,.05); }
  #page-saved .sq-group-chev { color:var(--muted); transition:transform .2s; font-size:.7rem; }
  #page-saved .sq-group.open .sq-group-chev { transform:rotate(90deg); }
  #page-saved .sq-group-name { flex:1; font-weight:700; font-size:.9rem; }
  #page-saved .sq-group-count { font-size:.68rem; color:var(--muted); background:var(--card,rgba(127,127,127,.12)); border:1px solid var(--border); padding:2px 9px; border-radius:99px; white-space:nowrap; }
  #page-saved .sq-group-body { display:none; padding:0 16px 14px; }
  #page-saved .sq-group.open .sq-group-body { display:block; }
  #page-saved .sq-group-body .sq-card { background:transparent; border-color:var(--border); }

  /* ── Quiz runner ── */
  #page-saved .sq-runbar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  #page-saved .sq-runbar .sq-rt { font-weight:800; font-size:1.05rem; }
  #page-saved .sq-timer { font-variant-numeric:tabular-nums; font-weight:800; background:var(--surface); border:1px solid var(--border); padding:.4rem .8rem; border-radius:8px; font-size:.9rem; }
  #page-saved .sq-run-grid { display:grid; grid-template-columns:1fr 240px; gap:16px; align-items:start; }
  @media (max-width:820px){ #page-saved .sq-run-grid { grid-template-columns:1fr; } #page-saved .sq-palette-wrap { order:-1; } }
  #page-saved .sq-qcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  #page-saved .sq-qbar { display:flex; justify-content:space-between; align-items:center; padding:11px 14px; border-bottom:1px solid var(--border); font-weight:700; font-size:.86rem; }
  #page-saved .sq-qtext { padding:16px; font-size:1rem; line-height:1.6; border-bottom:1px solid var(--border); }
  #page-saved .sq-qtext img { max-width:90%; max-height:240px; display:block; margin:10px auto; border:1px solid var(--border); border-radius:6px; }
  #page-saved .sq-run-opt { display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
  #page-saved .sq-run-opt:last-child { border-bottom:none; }
  #page-saved .sq-run-opt:hover { background:rgba(127,127,127,.06); }
  #page-saved .sq-radio { width:20px; height:20px; border:2px solid var(--muted); border-radius:50%; flex:0 0 auto; position:relative; margin-top:2px; }
  #page-saved .sq-run-opt.selected .sq-radio { border-color:var(--accent); }
  #page-saved .sq-run-opt.selected .sq-radio::after { content:""; position:absolute; inset:3px; background:var(--accent); border-radius:50%; }
  #page-saved .sq-run-opt.selected { background:rgba(11,94,215,.08); }
  #page-saved .sq-run-optxt { flex:1; font-size:.92rem; line-height:1.5; }
  #page-saved .sq-run-optxt img { max-width:160px; max-height:90px; display:block; margin-top:6px; border:1px solid var(--border); border-radius:4px; }
  #page-saved.sq-solution .sq-run-opt.correct { background:rgba(25,135,84,.16); }
  #page-saved.sq-solution .sq-run-opt.wrong { background:rgba(220,53,69,.16); }
  #page-saved .sq-run-exp { display:none; padding:14px; background:rgba(11,94,215,.06); border-top:2px solid var(--accent); font-size:.86rem; line-height:1.6; }
  #page-saved .sq-run-exp .sq-st { font-weight:700; margin-bottom:8px; }
  #page-saved .sq-palette-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; }
  #page-saved .sq-pal-grid { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  #page-saved .sq-pbtn { width:38px; height:36px; border-radius:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700; cursor:pointer; }
  #page-saved .sq-pbtn.answered { background:#198754; color:#fff; border-color:#198754; }
  #page-saved .sq-pbtn.current { outline:3px solid var(--accent); outline-offset:1px; }
  #page-saved .sq-pbtn.sol-right { background:#198754; color:#fff; border-color:#198754; }
  #page-saved .sq-pbtn.sol-wrong { background:#dc3545; color:#fff; border-color:#dc3545; }
  #page-saved .sq-pbtn.sol-skip { background:#9e9e9e; color:#fff; border-color:#9e9e9e; }
  #page-saved .sq-legend { font-size:.7rem; color:var(--muted); display:grid; gap:4px; }
  #page-saved .sq-run-foot { display:flex; gap:10px; justify-content:space-between; margin-top:14px; flex-wrap:wrap; }
  #page-saved .sq-run-foot .sq-foot-right { display:flex; gap:10px; flex-wrap:wrap; }

  /* ── Results / analysis ── */
  #page-saved .sq-score-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center; margin:14px 0 18px; }
  @media (max-width:560px){ #page-saved .sq-score-grid { grid-template-columns:repeat(2,1fr); } }
  #page-saved .sq-score-cell { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 10px; }
  #page-saved .sq-score-cell h4 { margin:0; font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #page-saved .sq-score-cell p { margin:6px 0 0; font-size:1.5rem; font-weight:800; }
  #page-saved .sq-analysis { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  #page-saved .sq-analysis h3 { margin:0 0 12px; font-size:.95rem; font-weight:800; }
  #page-saved .sq-bar-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:.8rem; }
  #page-saved .sq-bar-label { flex:0 0 40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #page-saved .sq-bar-track { flex:1; height:9px; background:rgba(127,127,127,.18); border-radius:99px; overflow:hidden; }
  #page-saved .sq-bar-fill { height:100%; border-radius:99px; }
  #page-saved .sq-bar-val { flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--muted); font-size:.74rem; }
  #page-saved .sq-acc-ring { display:flex; align-items:center; gap:16px; margin-bottom:6px; }
  #page-saved .sq-acc-big { font-size:2.2rem; font-weight:800; }
  </style>

  <!-- SHELL (sub-tabs + list views) — hidden while a quiz/result is showing -->
  <div id="sq-shell">
    <div class="sq-head">
      <div>
        <h2 class="sq-title">📝 Quiz</h2>
        <div class="sq-sub">Attempt quizzes built from questions you bookmarked during mock tests, then review your analysis.</div>
      </div>
      <div class="sq-controls">
        <button class="sq-btn" onclick="loadSavedQuestions(true)">🔄 Refresh</button>
      </div>
    </div>

    <div class="sq-subtabs">
      <button class="sq-subtab active" id="sq-st-available" onclick="sqSwitchView('available')">📚 Available</button>
      <button class="sq-subtab" id="sq-st-attempt" onclick="sqSwitchView('attempt')">▶ Attempt Quiz</button>
      <button class="sq-subtab" id="sq-st-saved" onclick="sqSwitchView('saved')">🔖 Saved</button>
    </div>

    <!-- AVAILABLE VIEW (playlist-wise shared quizzes + your saved-question quizzes) -->
    <div class="sq-view active" id="sq-view-available">
      <div class="sq-loading">Loading available quizzes…</div>
    </div>

    <!-- ATTEMPT QUIZ VIEW (your attempt history) -->
    <div class="sq-view" id="sq-view-attempt">
      <div class="sq-loading">Loading your attempts…</div>
    </div>

    <!-- SAVED VIEW (quiz-wise) -->
    <div class="sq-view" id="sq-view-saved">
      <div class="sq-loading">Loading your saved questions…</div>
    </div>
  </div>

  <!-- QUIZ RUNNER VIEW -->
  <div id="sq-quiz" style="display:none;"></div>

  <!-- RESULT / ANALYSIS VIEW -->
  <div id="sq-result" style="display:none;"></div>
</div>
