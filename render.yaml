services:
  # PrepPath Telegram Bot — replies with Chat ID on /start
  # Free worker tier on Render.com
  - type: web
    name: examzen-telegram-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install
    startCommand: node bot-server.js
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Set this manually in Render dashboard
      # Required to verify browser Firebase ID tokens and authorize relay calls.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Same current OmniRoute API base used by the Flask proxy. Required only
      # when Telegram /ask may select or fail over to OmniRoute.
      - key: OMNIROUTE_URL
        sync: false
      # Comma-separated browser origins permitted to call relay endpoints.
      # The service's built-in defaults are always allowed; this only ADDS to
      # them, so the live GitHub Pages origin can never be dropped by a stale
      # value (that is what broke "Send to Telegram" with "Failed to fetch").
      - key: ALLOWED_ORIGINS
        value: "https://examzen.in,https://www.examzen.in,https://purendar950.github.io,https://appassets.androidengine"
      # Fallback base URL for Telegram deep links when the caller's origin is
      # unknown (Android WebView). Browser callers use their own allow-listed
      # base automatically.
      - key: APP_BASE_URL
        value: "https://purendar950.github.io/Examen-planner"
      - key: NODE_ENV
        value: production

  # YouTube Turbo Proxy — yt-dlp + Flask transcript/notes backend that powers
  # AI Study. Docker service (also carries the bgutil PO-token server + Deno).
  # Reads AI provider keys + rate limits from Firestore via FIREBASE_SERVICE_ACCOUNT.
  - type: web
    name: youtube-turbo-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: youtube-turbo-proxy
    healthCheckPath: /health
    envVars:
      - key: MAX_HEIGHT
        value: "720"
      - key: CACHE_TTL
        value: "18000"
      # Netscape cookies.txt from a THROWAWAY YouTube account (set in dashboard).
      - key: YT_COOKIES
        sync: false
      # SAME service-account JSON the Telegram bot uses — lets the proxy read
      # config/ai + config/aiLimits from Firestore.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # REQUIRED for OmniRoute chat/image/search/speech/video. Set this to the
      # current persistent API base (for example https://host.example/v1).
      # Do not leave an expired ngrok URL here: its stale Firestore catalog can
      # still populate selectors while every generation request returns 404.
      - key: OMNIROUTE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://examzen.in,https://www.examzen.in,https://purendar950.github.io,https://appassets.androidengine"
      - key: MAX_TELEGRAM_IMAGE_BYTES
        value: "8388608"

  # Kiro API Key Test — standalone tool that verifies a KIRO_API_KEY works via
  # kiro-cli headless mode (server.js in kiro-test/). Personal testing tool,
  # not part of AI Study. Unauthenticated — anyone with the URL can spend Kiro
  # credits, so keep the URL private (or add a shared-secret check).
  #
  # CRITICAL: Render's build and runtime run on SEPARATE filesystems. Anything
  # installed OUTSIDE the project directory (e.g. the installer's default
  # $HOME/.local/bin) is discarded before runtime — confirmed via /api/diag
  # (binaryExists:false, HOME=/opt/render). server.js therefore looks for the
  # binary at kiro-test/vendor/kiro/.local/bin/kiro-cli. So the build overrides
  # HOME to that vendor dir (the installer writes to $HOME/.local/bin), which
  # keeps kiro-cli INSIDE the project dir and available at runtime.
  - type: web
    name: kiro-key-test
    runtime: node
    rootDir: kiro-test
    plan: free
    buildCommand: "rm -rf vendor && mkdir -p vendor/kiro && env HOME=\"$PWD/vendor/kiro\" bash -c 'curl -fsSL https://cli.kiro.dev/install | bash' && npm install"
    startCommand: "node server.js"
    envVars:
      # Your Kiro API key (ksk_...). Set manually in the Render dashboard.
      - key: KIRO_API_KEY
        sync: false
