services:
  # PrepPath Telegram Bot — replies with Chat ID on /start
  # Free worker tier on Render.com
  - type: web
    name: examzen-telegram-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install
    startCommand: node bot-server.js
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Set this manually in Render dashboard
      - key: NODE_ENV
        value: production

  # Kiro API key test — proxies a browser prompt to kiro-cli (headless mode),
  # keeping KIRO_API_KEY server-side only. Free web tier.
  - type: web
    name: kiro-key-test
    runtime: node
    rootDir: kiro-test
    plan: free
    # rm -f prefix works around a bug in kiro-cli's installer: if the binary
    # already exists (e.g. a reused Render build cache), the installer tries to
    # prompt "replace it? (y/N)" via /dev/tty, which does not exist in Render's
    # non-interactive build shell, so the script crashes with exit code 1.
    buildCommand: rm -f ~/.local/bin/kiro-cli ~/.local/bin/kiro-cli-chat ~/.local/bin/kiro-cli-term; curl -fsSL https://cli.kiro.dev/install | bash && npm install
    # PATH must be re-exported here: Render's build and start steps run in
    # separate shells, so a PATH export during build does not carry over.
    startCommand: export PATH="$HOME/.local/bin:$PATH" && node server.js
    envVars:
      - key: KIRO_API_KEY
        sync: false          # Set this manually in Render dashboard
