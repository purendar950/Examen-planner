services:
  # PrepPath Telegram Bot — replies with Chat ID on /start
  # Free worker tier on Render.com
  - type: web
    name: examzen-telegram-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install
    startCommand: node bot-server.js
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Set this manually in Render dashboard
      - key: NODE_ENV
        value: production

  # YouTube Turbo Proxy — yt-dlp + Flask transcript/notes backend that powers
  # AI Study. Docker service (also carries the bgutil PO-token server + Deno).
  # Reads AI provider keys + rate limits from Firestore via FIREBASE_SERVICE_ACCOUNT.
  - type: web
    name: youtube-turbo-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: youtube-turbo-proxy
    healthCheckPath: /health
    envVars:
      - key: MAX_HEIGHT
        value: "720"
      - key: CACHE_TTL
        value: "18000"
      # Netscape cookies.txt from a THROWAWAY YouTube account (set in dashboard).
      - key: YT_COOKIES
        sync: false
      # SAME service-account JSON the Telegram bot uses — lets the proxy read
      # config/ai + config/aiLimits from Firestore.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # Kiro API Key Test — standalone tool that verifies a KIRO_API_KEY works via
  # kiro-cli headless mode (server.js in kiro-test/). Personal testing tool,
  # not part of AI Study. Unauthenticated — anyone with the URL can spend Kiro
  # credits, so keep the URL private (or add a shared-secret check).
  #
  # NOTE: the "rm -f ..." prefix in buildCommand is REQUIRED — without it the
  # kiro-cli installer hits an interactive y/N prompt on redeploys (no TTY on
  # Render) and the build fails. The "export PATH=..." in startCommand is also
  # required because Render runs build and start in separate shells.
  - type: web
    name: kiro-key-test
    runtime: node
    rootDir: kiro-test
    plan: free
    buildCommand: "rm -f ~/.local/bin/kiro-cli ~/.local/bin/kiro-cli-chat ~/.local/bin/kiro-cli-term; curl -fsSL https://cli.kiro.dev/install | bash && npm install"
    startCommand: 'export PATH="$HOME/.local/bin:$PATH" && node server.js'
    envVars:
      # Your Kiro API key (ksk_...). Set manually in the Render dashboard.
      - key: KIRO_API_KEY
        sync: false
