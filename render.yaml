services:
  # PrepPath Telegram Bot — replies with Chat ID on /start
  # Free worker tier on Render.com
  - type: web
    name: examzen-telegram-bot
    runtime: node
    rootDir: bot
    buildCommand: npm install
    startCommand: node bot-server.js
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # Set this manually in Render dashboard
      - key: NODE_ENV
        value: production

  # Kiro API key test — proxies a browser prompt to kiro-cli (headless mode),
  # keeping KIRO_API_KEY server-side only. Free web tier.
  - type: web
    name: kiro-key-test
    runtime: node
    rootDir: kiro-test
    plan: free
    # Health check keeps the free-tier service from sleeping (prevents cold-start
    # 502 timeouts). Self-ping in server.js provides a secondary keep-alive.
    healthCheckPath: /health
    # Render's build and runtime run on SEPARATE filesystems: files installed
    # outside the project directory during build (the installer's default
    # $HOME/.local/bin) are discarded before runtime, causing "spawn kiro-cli
    # ENOENT" (confirmed via /api/diag: binaryExists:false at runtime). Fix:
    # override HOME so the installer writes into ./vendor/kiro (INSIDE the
    # project dir), which ships to runtime with the code. `rm -rf` first
    # guarantees a clean dir, so the installer never hits its interactive
    # "replace? (y/N)" /dev/tty prompt.
    buildCommand: rm -rf vendor/kiro && mkdir -p vendor/kiro && curl -fsSL https://cli.kiro.dev/install | HOME="$PWD/vendor/kiro" bash && npm install
    # Add the vendored bin dir to PATH at runtime. server.js also resolves the
    # binary relative to __dirname, so this is a belt-and-suspenders measure.
    startCommand: export PATH="$PWD/vendor/kiro/.local/bin:$HOME/.local/bin:$PATH" && node server.js
    envVars:
      - key: KIRO_API_KEY
        sync: false          # Set this manually in Render dashboard

  # YouTube Turbo Proxy — yt-dlp + Flask transcript/notes backend that powers
  # AI Study. Docker service (also carries the bgutil PO-token server + Deno).
  # Reads AI provider keys + rate limits from Firestore via FIREBASE_SERVICE_ACCOUNT.
  - type: web
    name: youtube-turbo-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: youtube-turbo-proxy
    healthCheckPath: /health
    envVars:
      - key: MAX_HEIGHT
        value: "720"
      - key: CACHE_TTL
        value: "18000"
      # Netscape cookies.txt from a THROWAWAY YouTube account (set in dashboard).
      - key: YT_COOKIES
        sync: false
      # SAME service-account JSON the Telegram bot uses — lets the proxy read
      # config/ai (provider keys incl. kiroApiKeys) + config/aiLimits from Firestore.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
