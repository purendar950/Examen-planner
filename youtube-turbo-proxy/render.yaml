services:
  - type: web
    name: youtube-turbo-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: youtube-turbo-proxy
    healthCheckPath: /health
    envVars:
      - key: MAX_HEIGHT
        value: "720"
      - key: CACHE_TTL
        value: "18000"
      # Paste the contents of a Netscape cookies.txt from a THROWAWAY YouTube
      # account here (Render dashboard -> Environment -> add as a secret).
      # Leave empty to run without cookies (many videos will be bot-gated).
      - key: YT_COOKIES
        sync: false
      # Optional: set to the SAME service-account JSON the Telegram bot uses to
      # let admins manage cookies from the admin panel (Firestore config/turbo).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://examzen.in,https://www.examzen.in,https://appassets.androidengine"
      - key: MAX_TELEGRAM_IMAGE_BYTES
        value: "8388608"
      # GitHub OAuth App settings. Configure these in Render after creating the app.
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: GITHUB_OAUTH_FRONTEND_ORIGIN
        value: "https://examzen.in"
      # Optional server-side token for higher public GitHub API rate limits.
      - key: GITHUB_TOKEN
        sync: false
