services:
  - type: web
    name: youtube-turbo-proxy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: youtube-turbo-proxy
    healthCheckPath: /health
    envVars:
      - key: MAX_HEIGHT
        value: "720"
      - key: CACHE_TTL
        value: "18000"
      # Paste the contents of a Netscape cookies.txt from a THROWAWAY YouTube
      # account here (Render dashboard -> Environment -> add as a secret).
      # Leave empty to run without cookies (many videos will be bot-gated).
      - key: YT_COOKIES
        sync: false
      # Optional: set to the SAME service-account JSON the Telegram bot uses to
      # let admins manage cookies from the admin panel (Firestore config/turbo).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://examzen.in,https://www.examzen.in,https://appassets.androidengine"
      - key: MAX_TELEGRAM_IMAGE_BYTES
        value: "8388608"
      # Admin-only OpenCode planner. Keep this service URL, Basic Auth password,
      # and workspace path in Render secrets. The model is server-controlled;
      # only its non-sensitive label is returned to an authenticated admin.
      - key: OPENCODE_SERVER_URL
        sync: false
      - key: OPENCODE_SERVER_USERNAME
        sync: false
      - key: OPENCODE_SERVER_PASSWORD
        sync: false
      - key: OPENCODE_PROVIDER_ID
        sync: false
      - key: OPENCODE_MODEL_ID
        sync: false
      - key: OPENCODE_DIRECTORY
        sync: false
      # OpenCode Zen optional automatic temporary-free-model selector. It reads
      # the public Zen catalog hourly and uses OPENCODE_MODEL_ID only as a
      # fallback when no supported free model is listed.
      - key: OPENCODE_AUTO_FREE_MODEL
        value: "true"
      - key: OPENCODE_FREE_MODEL_REFRESH_SEC
        value: "3600"
      - key: OPENCODE_FREE_MODEL_PREFERENCE
        value: "deepseek-v4-flash-free,mimo-v2.5-free,ling-3.0-flash-free,nemotron-3-ultra-free,laguna-s-2.1-free,north-mini-code-free,big-pickle"
      # Allow authenticated Study AI users to select OpenCode. Credentials stay
      # server-only and every request uses the fixed directory with all tools off.
      - key: OPENCODE_STUDY_ENABLED
        value: "true"
      - key: OPENCODE_STUDY_MAX_PROMPT_CHARS
        value: "120000"
      - key: OPENCODE_TIMEOUT
        value: "90"
