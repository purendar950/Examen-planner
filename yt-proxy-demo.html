<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Proxy Demo — StudyPlanner</title>
<style>
  :root { --bg:#0f1117; --card:#1a1f2b; --border:#2a3140; --text:#e7ecf5; --muted:#8b95a7; --accent:#00c896; --err:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); padding:16px; line-height:1.5; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:0.8rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:0.75rem; color:var(--muted); margin:10px 0 4px; }
  input[type=text] { width:100%; background:#0f1319; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:0.82rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--accent); color:#00140d; border:none; border-radius:8px; padding:10px 16px; font-size:0.85rem; font-weight:700; cursor:pointer; }
  button.secondary { background:#2a3140; color:var(--text); }
  .chk { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text); margin-top:10px; }
  #status { font-size:0.82rem; padding:10px 12px; border-radius:8px; margin-top:12px; display:none; white-space:pre-wrap; }
  .ok  { background:rgba(0,200,150,.12); border:1px solid rgba(0,200,150,.4); color:var(--accent); display:block !important; }
  .bad { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4); color:#ff9d9d; display:block !important; }
  .warn{ background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:#ffcf80; display:block !important; }
  .videos { list-style:none; padding:0; margin:10px 0 0; max-height:220px; overflow:auto; }
  .videos li { font-size:0.8rem; padding:6px 8px; border-bottom:1px solid var(--border); display:flex; gap:8px; }
  .videos .num { color:var(--muted); min-width:22px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; margin-top:12px; }
  .player iframe { width:100%; height:100%; border:0; }
  .badge { display:inline-block; font-size:0.68rem; padding:2px 8px; border-radius:20px; margin-left:6px; }
  .b-worker { background:rgba(0,200,150,.2); color:var(--accent); }
  .b-fallback { background:rgba(245,158,11,.2); color:var(--warn); }
  .b-type { background:rgba(59,130,246,.2); color:#7db4ff; }
  code { background:#0f1319; padding:1px 5px; border-radius:4px; font-size:0.78rem; }
</style>
</head>
<body>
  <h1>🔬 YouTube Proxy Demo</h1>
  <p class="sub">Tests the Cloudflare Worker (metadata fetch) with automatic fallback to the plain YouTube IFrame if all keys fail. Works with playlists AND single videos. This page does NOT touch the real app.</p>

  <div class="card">
    <label>Cloudflare Worker URL</label>
    <input type="text" id="worker" value="https://cold-paper-bc65.syncstudyssc.workers.dev" />

    <label>YouTube URL or ID (playlist OR video — /live, /watch, youtu.be, /shorts all work)</label>
    <input type="text" id="input" value="https://www.youtube.com/live/FNiqmNSYS9Q" />

    <div class="chk">
      <input type="checkbox" id="simFail" />
      <label for="simFail" style="margin:0;color:var(--text);">Simulate "all 4 keys failed" (test the IFrame fallback)</label>
    </div>

    <div class="row" style="margin-top:14px;">
      <button id="loadBtn">▶ Load</button>
      <button class="secondary" id="clearBtn">Clear</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="resultHead"></div>
    <div class="player" id="playerWrap"></div>
    <ul class="videos" id="videoList"></ul>
  </div>

<script>
const $ = id => document.getElementById(id);

/* Detect whether the input is a playlist or a single video, and pull the id. */
function parseInput(v) {
  v = (v || '').trim();
  // Playlist (has list=)
  const pl = v.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (pl) return { type: 'playlist', id: pl[1] };
  // Single video — /watch?v=, youtu.be/, /live/, /shorts/, /embed/
  const vid = v.match(/(?:youtube\.com\/(?:watch\?v=|live\/|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (vid) return { type: 'video', id: vid[1] };
  // Raw ids
  if (/^PL[A-Za-z0-9_-]{10,}$/.test(v)) return { type: 'playlist', id: v };
  if (/^[A-Za-z0-9_-]{11}$/.test(v))    return { type: 'video', id: v };
  return null;
}

function setStatus(msg, cls) { const el = $('status'); el.className = cls; el.textContent = msg; }

/* Original YouTube IFrame — plays without the Data API (0 quota). */
function showPlayer(kind, id) {
  const src = kind === 'playlist'
    ? 'https://www.youtube-nocookie.com/embed/videoseries?list=' + id + '&rel=0&modestbranding=1'
    : 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&modestbranding=1';
  $('playerWrap').innerHTML = '<iframe src="' + src + '" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>';
}

async function workerFetch(base, endpoint, params) {
  const url = base.replace(/\/+$/, '') + '/' + endpoint + '?' + params;
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}

function fallback(kind, id, msg) {
  setStatus(msg, 'warn');
  $('resultHead').innerHTML = '<strong>' + (kind === 'playlist' ? 'Playlist' : 'Video') + '</strong> <span class="badge b-fallback">IFrame fallback</span>';
  showPlayer(kind, id);
  $('resultCard').style.display = 'block';
}

async function load() {
  const base = $('worker').value.trim();
  const parsed = parseInput($('input').value);
  const simFail = $('simFail').checked;

  $('resultCard').style.display = 'none';
  $('videoList').innerHTML = '';
  $('resultHead').innerHTML = '';

  if (!parsed) { setStatus('❌ Valid YouTube URL/ID daalo (playlist ya video).', 'bad'); return; }
  const { type, id } = parsed;

  // Fallback path: pretend all keys failed → plain IFrame only
  if (simFail) {
    fallback(type, id, '⚠️ Simulated: all 4 keys failed.\n→ Falling back to the ORIGINAL YouTube IFrame (playback still works, 0 quota).\nMetadata (title/list) unavailable in this mode — exactly how the real app degrades.');
    return;
  }

  setStatus('⏳ Fetching ' + type + ' via Cloudflare Worker…', 'ok');

  try {
    if (type === 'video') {
      const info = await workerFetch(base, 'videos', 'part=snippet&id=' + id);
      const reason = info.data?.error?.errors?.[0]?.reason || '';
      const item = info.data?.items?.[0];
      if (reason || !item) {
        fallback('video', id, '⚠️ Worker fetch failed (reason: ' + (reason || 'no data') + ').\n→ Falling back to the ORIGINAL YouTube IFrame so playback still works.');
        return;
      }
      const s = item.snippet || {};
      setStatus('✅ SUCCESS via Cloudflare Worker — key never left the server.\nVideo metadata fetched. No googleapis call from the browser, no key= in the URL.', 'ok');
      $('resultHead').innerHTML = '<strong>' + escapeHtml(s.title || '(untitled)') + '</strong> <span class="badge b-worker">via Worker</span><span class="badge b-type">video</span><div style="color:var(--muted);font-size:0.75rem;margin-top:2px;">' + escapeHtml(s.channelTitle || '') + '</div>';
      showPlayer('video', id);
      $('resultCard').style.display = 'block';
      return;
    }

    // Playlist
    const info  = await workerFetch(base, 'playlists', 'part=snippet&id=' + id);
    const items = await workerFetch(base, 'playlistItems', 'part=snippet&maxResults=50&playlistId=' + id);
    const reason = info.data?.error?.errors?.[0]?.reason || items.data?.error?.errors?.[0]?.reason || '';
    const vids = Array.isArray(items.data?.items) ? items.data.items : [];
    if (reason || vids.length === 0) {
      fallback('playlist', id, '⚠️ Worker fetch failed (reason: ' + (reason || 'no data') + ').\n→ Falling back to the ORIGINAL YouTube IFrame so playback still works.');
      return;
    }
    const title = info.data.items?.[0]?.snippet?.title || '(untitled)';
    const channel = info.data.items?.[0]?.snippet?.channelTitle || '';
    setStatus('✅ SUCCESS via Cloudflare Worker — key never left the server.\nFetched ' + vids.length + ' videos (first page). No googleapis call from the browser, no key= in the URL.', 'ok');
    $('resultHead').innerHTML = '<strong>' + escapeHtml(title) + '</strong> <span class="badge b-worker">via Worker</span><span class="badge b-type">playlist</span><div style="color:var(--muted);font-size:0.75rem;margin-top:2px;">' + escapeHtml(channel) + ' · ' + vids.length + ' videos (page 1)</div>';
    showPlayer('playlist', id);
    $('videoList').innerHTML = vids.map((v, i) => {
      const s = v.snippet || {};
      return '<li><span class="num">' + (i + 1) + '</span><span>' + escapeHtml(s.title || '') + '</span></li>';
    }).join('');
    $('resultCard').style.display = 'block';

  } catch (e) {
    fallback(type, id, '⚠️ Worker unreachable (' + e.message + ').\n→ Falling back to the ORIGINAL YouTube IFrame.');
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

$('loadBtn').addEventListener('click', load);
$('clearBtn').addEventListener('click', () => {
  $('resultCard').style.display = 'none';
  $('status').style.display = 'none';
  $('videoList').innerHTML = '';
  $('playerWrap').innerHTML = '';
});
</script>
</body>
</html>
