<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Proxy Demo — PrepPath</title>
<style>
  :root { --bg:#0f1117; --card:#1a1f2b; --border:#2a3140; --text:#e7ecf5; --muted:#8b95a7; --accent:#00c896; --err:#ef4444; --warn:#f59e0b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); padding:16px; line-height:1.5; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:0.8rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:0.75rem; color:var(--muted); margin:10px 0 4px; }
  input[type=text] { width:100%; background:#0f1319; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:0.82rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--accent); color:#00140d; border:none; border-radius:8px; padding:10px 16px; font-size:0.85rem; font-weight:700; cursor:pointer; }
  button.secondary { background:#2a3140; color:var(--text); }
  .chk { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--text); margin-top:10px; }
  #status { font-size:0.82rem; padding:10px 12px; border-radius:8px; margin-top:12px; display:none; white-space:pre-wrap; }
  .ok  { background:rgba(0,200,150,.12); border:1px solid rgba(0,200,150,.4); color:var(--accent); display:block !important; }
  .bad { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4); color:#ff9d9d; display:block !important; }
  .warn{ background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); color:#ffcf80; display:block !important; }
  .videos { list-style:none; padding:0; margin:10px 0 0; max-height:220px; overflow:auto; }
  .videos li { font-size:0.8rem; padding:6px 8px; border-bottom:1px solid var(--border); display:flex; gap:8px; }
  .videos .num { color:var(--muted); min-width:22px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; margin-top:12px; }
  .player iframe { width:100%; height:100%; border:0; }
  .badge { display:inline-block; font-size:0.68rem; padding:2px 8px; border-radius:20px; margin-left:6px; }
  .b-worker { background:rgba(0,200,150,.2); color:var(--accent); }
  .b-fallback { background:rgba(245,158,11,.2); color:var(--warn); }
  code { background:#0f1319; padding:1px 5px; border-radius:4px; font-size:0.78rem; }
</style>
</head>
<body>
  <h1>🔬 YouTube Proxy Demo</h1>
  <p class="sub">Tests the Cloudflare Worker (metadata fetch) with automatic fallback to the plain YouTube IFrame if all keys fail. This page does NOT touch the real app.</p>

  <div class="card">
    <label>Cloudflare Worker URL</label>
    <input type="text" id="worker" value="https://cold-paper-bc65.syncstudyssc.workers.dev" />

    <label>YouTube Playlist URL or ID</label>
    <input type="text" id="playlist" value="PLbpi6ZahtOH6Blw3RGYpWkSByi_T7Rygb" />

    <div class="chk">
      <input type="checkbox" id="simFail" />
      <label for="simFail" style="margin:0;color:var(--text);">Simulate "all 4 keys failed" (test the IFrame fallback)</label>
    </div>

    <div class="row" style="margin-top:14px;">
      <button id="loadBtn">▶ Load playlist</button>
      <button class="secondary" id="clearBtn">Clear</button>
    </div>

    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="resultHead"></div>
    <div class="player" id="playerWrap"></div>
    <ul class="videos" id="videoList"></ul>
  </div>

<script>
const $ = id => document.getElementById(id);

function extractPlaylistId(v) {
  v = (v || '').trim();
  const m = v.match(/[?&]list=([A-Za-z0-9_-]+)/);
  if (m) return m[1];
  if (/^[A-Za-z0-9_-]{10,}$/.test(v)) return v; // looks like a raw ID
  return null;
}

function setStatus(msg, cls) {
  const el = $('status');
  el.className = cls;
  el.textContent = msg;
}

function showPlayer(plId) {
  // Original YouTube IFrame — plays the playlist WITHOUT the Data API (0 quota)
  $('playerWrap').innerHTML =
    '<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=' + plId +
    '&rel=0&modestbranding=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>';
}

async function workerFetch(base, endpoint, params) {
  const url = base.replace(/\/+$/, '') + '/' + endpoint + '?' + params;
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}

async function load() {
  const base = $('worker').value.trim();
  const plId = extractPlaylistId($('playlist').value);
  const simFail = $('simFail').checked;

  $('resultCard').style.display = 'none';
  $('videoList').innerHTML = '';
  $('resultHead').innerHTML = '';

  if (!plId) { setStatus('❌ Valid playlist URL/ID daalo.', 'bad'); return; }

  // ── Fallback path: pretend all keys failed → use plain IFrame only ──
  if (simFail) {
    setStatus('⚠️ Simulated: all 4 keys failed.\n→ Falling back to the ORIGINAL YouTube IFrame (playback still works, 0 quota).\nSidebar video list unavailable in this mode — exactly how the real app degrades.', 'warn');
    $('resultHead').innerHTML = '<strong>Playlist</strong> <span class="badge b-fallback">IFrame fallback</span>';
    showPlayer(plId);
    $('resultCard').style.display = 'block';
    return;
  }

  setStatus('⏳ Fetching via Cloudflare Worker…', 'ok');

  try {
    // 1) playlist title
    const info = await workerFetch(base, 'playlists', 'part=snippet&id=' + plId);
    // 2) first page of videos
    const items = await workerFetch(base, 'playlistItems', 'part=snippet&maxResults=50&playlistId=' + plId);

    const reason = info.data?.error?.errors?.[0]?.reason || items.data?.error?.errors?.[0]?.reason || '';
    const gotVideos = Array.isArray(items.data?.items) && items.data.items.length > 0;

    if (reason || !gotVideos) {
      // Worker/keys failed → fall back to plain IFrame (this is the desired behaviour)
      setStatus('⚠️ Worker fetch failed (reason: ' + (reason || 'no data') + ').\n→ Falling back to the ORIGINAL YouTube IFrame so playback still works.', 'warn');
      $('resultHead').innerHTML = '<strong>Playlist</strong> <span class="badge b-fallback">IFrame fallback</span>';
      showPlayer(plId);
      $('resultCard').style.display = 'block';
      return;
    }

    // ✅ Success via Worker
    const title = info.data.items?.[0]?.snippet?.title || '(untitled)';
    const channel = info.data.items?.[0]?.snippet?.channelTitle || '';
    const vids = items.data.items;

    setStatus('✅ SUCCESS via Cloudflare Worker — key never left the server.\nFetched ' + vids.length + ' videos (first page). No googleapis call from the browser, no key= in the URL.', 'ok');
    $('resultHead').innerHTML = '<strong>' + escapeHtml(title) + '</strong> <span class="badge b-worker">via Worker</span><div style="color:var(--muted);font-size:0.75rem;margin-top:2px;">' + escapeHtml(channel) + ' · ' + vids.length + ' videos (page 1)</div>';

    showPlayer(plId);

    const listHtml = vids.map((v, i) => {
      const s = v.snippet || {};
      return '<li><span class="num">' + (i + 1) + '</span><span>' + escapeHtml(s.title || '') + '</span></li>';
    }).join('');
    $('videoList').innerHTML = listHtml;
    $('resultCard').style.display = 'block';

  } catch (e) {
    // Network/CORS error → also fall back to IFrame
    setStatus('⚠️ Worker unreachable (' + e.message + ').\n→ Falling back to the ORIGINAL YouTube IFrame.', 'warn');
    $('resultHead').innerHTML = '<strong>Playlist</strong> <span class="badge b-fallback">IFrame fallback</span>';
    showPlayer(plId);
    $('resultCard').style.display = 'block';
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

$('loadBtn').addEventListener('click', load);
$('clearBtn').addEventListener('click', () => {
  $('resultCard').style.display = 'none';
  $('status').style.display = 'none';
  $('videoList').innerHTML = '';
  $('playerWrap').innerHTML = '';
});
</script>
</body>
</html>
